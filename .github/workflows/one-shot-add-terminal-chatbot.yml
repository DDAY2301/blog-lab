name: One-shot add terminal chatbot

on:
  push:
    paths:
      - ".github/workflows/one-shot-add-terminal-chatbot.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-add-terminal-chatbot
  cancel-in-progress: true

jobs:
  patch-terminal-chatbot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync latest main
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Apply chatbot patch
        run: python scripts/patch_terminal_chatbot.py

      - name: Validate worker source
        shell: bash
        run: |
          node --check terminal/worker/src/index.js
          grep -q 'terminalChatAssistant' terminal/worker/src/index.js
          grep -q 'url.pathname === "/api/chat"' terminal/worker/src/index.js
          grep -q 'terminalChatbotDock' terminal/worker/src/index.js

      - name: Commit terminal chatbot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "blog-lab-worker[bot]"
          git config user.email "blog-lab-worker[bot]@users.noreply.github.com"
          git add terminal/worker/src/index.js
          if git diff --cached --quiet; then
            echo "No chatbot changes to commit."
            exit 0
          fi
          git commit -m "Worker: place chatbot inside terminal UI"
          git pull --rebase origin main
          git push origin HEAD:main

