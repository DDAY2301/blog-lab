name: Dispatch AI Resilience Hotfix

on:
  push:
    paths:
      - .github/workflows/ai-resilience-dispatch.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch hotfix workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ai-resilience-hotfix.yml --ref main
