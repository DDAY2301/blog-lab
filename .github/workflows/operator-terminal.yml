name: Private Operator Terminal
run-name: Private Terminal · ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Opaque terminal request ID"
        required: true
        type: string
      payload:
        description: "AES-GCM encrypted operator payload"
        required: true
        type: string

concurrency:
  group: private-operator-terminal
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
  copilot-requests: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TERMINAL_COMMAND_KEY: ${{ secrets.TERMINAL_COMMAND_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      AGENT_ENABLED: ${{ vars.AGENT_ENABLED || 'true' }}
      PUBLISH_MODE: ${{ vars.PUBLISH_MODE || 'automatic' }}
      AI_PROVIDER: "auto"
      WORKER_AI_URL: "https://blog-lab.dan-grmusa.workers.dev/api/ai/write"
      WORKER_SITE_AI_URL: "https://blog-lab.dan-grmusa.workers.dev/api/ai/edit"
      WORKER_AI_TOKEN: ${{ secrets.TERMINAL_COMMAND_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      MODEL_BASE_URL: ${{ secrets.MODEL_BASE_URL }}
      MODEL_NAME: ${{ secrets.MODEL_NAME }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Sync latest main
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-agent.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          pip install -r requirements-agent.txt
          npm ci
          npm install -g @github/copilot@latest
      - name: Test protected operator code
        run: |
          python -m py_compile agents/operator-terminal/*.py agents/blog-lab-publisher/agent.py agents/blog-lab-publisher/services/*.py
          pytest -q agents/operator-terminal/tests agents/blog-lab-publisher/tests
      - name: Decrypt private command
        run: python agents/operator-terminal/decrypt.py "$RUNNER_TEMP/operator-command.json"
      - name: Handle deterministic schedule/catch-up command
        id: compound
        shell: bash
        run: |
          set +e
          python agents/operator-terminal/compound_control.py \
            --command-file "$RUNNER_TEMP/operator-command.json" \
            --github-output "$GITHUB_OUTPUT" \
            --dispatch
          COMPOUND_RC=$?
          set -e
          if [[ "$COMPOUND_RC" -eq 0 || "$COMPOUND_RC" -eq 78 ]]; then
            exit 0
          fi
          exit "$COMPOUND_RC"
      - name: Execute private command with bounded recovery
        if: ${{ steps.compound.outputs.handled != 'true' }}
        shell: bash
        run: |
          set -u
          LOG="$RUNNER_TEMP/operator-command.log"
          : > "$LOG"
          for attempt in 1 2 3; do
            echo "Operator attempt $attempt/3"
            set +e
            python agents/operator-terminal/command.py --command-file "$RUNNER_TEMP/operator-command.json" 2>&1 | tee "$LOG"
            COMMAND_RC=${PIPESTATUS[0]}
            set -e
            if [[ "$COMMAND_RC" -eq 0 ]] \
              && pytest -q agents/blog-lab-publisher/tests \
              && npm run build; then
              echo "Operator request validated on attempt $attempt."
              exit 0
            fi
            if [[ "$COMMAND_RC" -eq 64 ]]; then
              if grep -Eqi 'SITE_AI_CAPACITY_UNAVAILABLE|AI capacity unavailable|Workers AI kvota|Workers AI quota|daily free allocation' "$LOG"; then
                echo "::warning::Workers AI site-editor capacity is unavailable. Queuing this site edit for automatic replay instead of failing the terminal request."
                python agents/operator-terminal/deferred_site_edits.py append \
                  --command-file "$RUNNER_TEMP/operator-command.json" \
                  --request-id "${{ inputs.request_id }}" \
                  --reason "$(tail -c 1400 "$LOG")"
                exit 0
              fi
              echo "::error::The request cannot be completed safely with the currently available sources/configuration. Not retrying."
              exit 64
            fi
            if [[ "$attempt" -ge 3 ]]; then
              echo "::error::Operator request failed after 3 validated attempts."
              exit 1
            fi
            echo "::warning::Attempt $attempt failed; restoring clean repository state and retrying."
            git restore --staged --worktree .
            git clean -fd -e node_modules/
            sleep $((attempt * 4))
          done

      - name: Clean runner-only Python bytecode
        shell: bash
        run: |
          find agents -type d -name __pycache__ -prune -exec rm -rf {} +
          find agents -type f -name '*.pyc' -delete

      - name: Reject edits to protected security paths
        shell: bash
        run: |
          CHANGED="$(
            git diff --name-only
            git ls-files --others --exclude-standard
          )"
          if printf '%s\n' "$CHANGED" | grep -Eq '^(\.github/|terminal/|agents/operator-terminal/|AGENTS\.md$|requirements-agent\.txt$|\.env)'; then
            echo "A protected path was modified; refusing to publish."
            printf '%s\n' "$CHANGED"
            exit 1
          fi
      - name: Ensure no obvious credentials were written
        shell: bash
        run: |
          if git grep -I -n -E "(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,})" -- . ':(exclude)package-lock.json'; then
            echo "Credential-like material detected in tracked repository files."
            exit 1
          fi
      - name: Detect public site change
        id: web
        shell: bash
        run: |
          if git diff --quiet -- src public; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Commit verified changes
        shell: bash
        run: |
          if git diff --quiet && [[ -z "$(git status --porcelain)" ]]; then echo "No repository changes."; exit 0; fi
          git config user.name "blog-lab-terminal[bot]"
          git config user.email "blog-lab-terminal[bot]@users.noreply.github.com"
          git add -A -- src public data agents/blog-lab-publisher/config.yaml agents/blog-lab-publisher/prompts
          for optional_path in content/drafts logs; do
            if [[ -e "$optional_path" ]]; then
              git add -A -- "$optional_path"
            fi
          done
          if git diff --cached --quiet; then
            echo "::error::Repository changed, but no permitted changes were staged."
            git status --short
            exit 1
          fi
          git commit -m "Terminal: apply authenticated operator request"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Final synchronized public build
        if: ${{ steps.web.outputs.changed == 'true' }}
        run: npm run build
      - name: Configure Pages
        if: ${{ steps.web.outputs.changed == 'true' }}
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: ${{ steps.web.outputs.changed == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy Pages
        if: ${{ steps.web.outputs.changed == 'true' }}
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Destroy decrypted command
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/operator-command.json"
