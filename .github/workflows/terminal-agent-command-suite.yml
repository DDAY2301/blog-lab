name: Blog Lab Terminal Agent Command Suite

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"
  push:
    branches: ["main"]
    paths:
      - "terminal/worker/**"
      - ".github/workflows/terminal-deferred-recovery.yml"
      - "agents/operator-terminal/deferred_site_edits.py"
      - "agents/operator-terminal/deferred_articles.py"
      - "agents/operator-terminal/compound_control.py"
      - "agents/operator-terminal/command.py"
      - "scripts/patch_worker_dispatch_diagnostics.py"
      - "scripts/harden_terminal_agent.py"
      - "scripts/test_terminal_agent.py"
      - "scripts/test_terminal_runtime.mjs"
      - "scripts/test_terminal_live.py"
      - ".github/workflows/terminal-self-heal.yml"
      - "scripts/test_terminal_stress.mjs"
      - "scripts/test_operator_commands.py"
      - "data/terminal-command-test-suite.json"
      - ".github/workflows/terminal-agent-command-suite.yml"

concurrency:
  group: blog-lab-terminal-agent-command-suite
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  terminal-agent-command-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_WORKER_VERSION: auth-v6.22-terminal-stability
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Apply dispatch diagnostics overlay for tests
        run: python scripts/patch_worker_dispatch_diagnostics.py

      - name: Apply terminal hardening overlay for tests
        run: python scripts/harden_terminal_agent.py

      - name: Static terminal command suite
        run: python scripts/test_terminal_agent.py

      - name: Worker JavaScript syntax check
        run: node --check terminal/worker/src/index.js

      - name: Runtime terminal command behavior suite
        run: node scripts/test_terminal_runtime.mjs

      - name: Execution-level operator command suite
        run: python scripts/test_operator_commands.py

      - name: Terminal stress and resilience suite
        run: node scripts/test_terminal_stress.mjs

      - name: Live Worker contract probe
        id: live
        continue-on-error: true
        run: python scripts/test_terminal_live.py

      - name: Self-heal live Worker and re-probe
        if: ${{ steps.live.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::warning::Live terminal contract failed; requesting Worker redeploy."
          gh workflow run deploy-worker.yml --repo "$GITHUB_REPOSITORY" --ref main
          sleep 10
          python scripts/test_terminal_live.py

      - name: Verify no obsolete one-shot workflow remains
        run: test ! -e .github/workflows/one-shot-terminal-operational-chat.yml
