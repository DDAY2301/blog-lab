name: Deploy Blog Lab Worker
# BLOG_LAB_DISPATCH_TOKEN is synced to the Worker secret GITHUB_DISPATCH_TOKEN.

on:
  push:
    branches: ["main"]
    paths:
      - "terminal/worker/**"
      - "wrangler.jsonc"
      - "terminal/worker/wrangler.jsonc"
      - "scripts/patch_worker_dispatch_diagnostics.py"
      - "scripts/harden_terminal_agent.py"
      - "scripts/test_terminal_agent.py"
      - "scripts/test_terminal_runtime.mjs"
      - "scripts/test_terminal_live.py"
      - "scripts/test_terminal_stress.mjs"
      - "scripts/test_operator_commands.py"
      - "data/terminal-command-test-suite.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: blog-lab-worker-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BLOG_LAB_DISPATCH_TOKEN: ${{ secrets.BLOG_LAB_DISPATCH_TOKEN }}
      EXPECTED_WORKER_VERSION: auth-v6.24-product-onboarding
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check Cloudflare deployment secrets
        shell: bash
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID GitHub secrets. Worker was NOT deployed."
            exit 1
          fi

      - name: Check GitHub dispatch secret
        shell: bash
        run: |
          if [[ -z "${BLOG_LAB_DISPATCH_TOKEN:-}" ]]; then
            echo "::error::Missing BLOG_LAB_DISPATCH_TOKEN repository secret."
            exit 1
          fi

      - name: Sync GitHub dispatch token to Worker
        working-directory: terminal/worker
        shell: bash
        run: |
          printf '%s' "$BLOG_LAB_DISPATCH_TOKEN" | npx --yes wrangler@4.40.0 secret put GITHUB_DISPATCH_TOKEN

      - name: Apply Worker dispatch diagnostics patch
        shell: bash
        run: python scripts/patch_worker_dispatch_diagnostics.py

      - name: Apply terminal agent hardening
        shell: bash
        run: python scripts/harden_terminal_agent.py

      - name: Run terminal command suite checks
        shell: bash
        run: python scripts/test_terminal_agent.py

      - name: Runtime terminal command behavior suite
        run: node scripts/test_terminal_runtime.mjs

      - name: Execution-level operator command suite
        run: python scripts/test_operator_commands.py

      - name: Terminal stress and resilience suite
        run: node scripts/test_terminal_stress.mjs

      - name: Install Worker dependencies
        working-directory: terminal/worker
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Validate Worker source
        shell: bash
        run: |
          node --check terminal/worker/src/index.js
          grep -q "$EXPECTED_WORKER_VERSION" terminal/worker/src/index.js
          grep -q '/api/login-diagnostics' terminal/worker/src/index.js
          grep -q 'maj_login_ready' terminal/worker/src/index.js
          grep -q 'url.pathname === "/api/chat"' terminal/worker/src/index.js
          grep -q 'terminalChatAssistant' terminal/worker/src/index.js
          grep -q 'terminalOperationalAnswer' terminal/worker/src/index.js
          grep -q 'operational_publication_check' terminal/worker/src/index.js
          grep -q 'operational_terminal_diagnostics' terminal/worker/src/index.js
          grep -q 'terminalChatbotDock' terminal/worker/src/index.js
          grep -q 'GITHUB_WORKFLOW_DISPATCH_FAILED' terminal/worker/src/index.js
          grep -q 'GitHub odgovor:' terminal/worker/src/index.js
          grep -q 'url.pathname === "/api/commands"' terminal/worker/src/index.js
          grep -q 'id="helpCommands"' terminal/worker/src/index.js
          grep -q "PENDING_KEY='bloglab-terminal-pending-v1'" terminal/worker/src/index.js
          grep -q 'client_request_id' terminal/worker/src/index.js
          grep -q 'pollRunning=false,pollAgain=false' terminal/worker/src/index.js
          grep -q 'terminal_chat_ai_timeout' terminal/worker/src/index.js
          grep -q 'workers_ai_model_timeout' terminal/worker/src/index.js
          grep -q 'MAX_MEDIA_BYTES = 5 \* 1024 \* 1024' terminal/worker/src/index.js

      - name: Deploy Worker to Cloudflare
        working-directory: terminal/worker
        run: npx wrangler deploy

      - name: Verify live Worker contract
        run: python scripts/test_terminal_live.py
