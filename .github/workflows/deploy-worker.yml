name: Deploy Blog Lab Worker

on:
  push:
    branches: ["main"]
    paths:
      - "terminal/worker/**"
      - "wrangler.jsonc"
      - "terminal/worker/wrangler.jsonc"
      - "scripts/patch_worker_dispatch_diagnostics.py"
      - "scripts/harden_terminal_agent.py"
      - "scripts/test_terminal_agent.py"
      - "data/terminal-command-test-suite.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: blog-lab-worker-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_WORKER_VERSION: auth-v6.19-login-hardening
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check Cloudflare deployment secrets
        shell: bash
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID GitHub secrets. Worker was NOT deployed."
            exit 1
          fi

      - name: Apply Worker dispatch diagnostics patch
        shell: bash
        run: python scripts/patch_worker_dispatch_diagnostics.py

      - name: Apply terminal agent hardening
        shell: bash
        run: python scripts/harden_terminal_agent.py

      - name: Run terminal command suite checks
        shell: bash
        run: python scripts/test_terminal_agent.py

      - name: Install Worker dependencies
        working-directory: terminal/worker
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Validate Worker source
        shell: bash
        run: |
          node --check terminal/worker/src/index.js
          grep -q "$EXPECTED_WORKER_VERSION" terminal/worker/src/index.js
          grep -q '/api/login-diagnostics' terminal/worker/src/index.js
          grep -q 'maj_login_ready' terminal/worker/src/index.js
          grep -q 'url.pathname === "/api/chat"' terminal/worker/src/index.js
          grep -q 'terminalChatAssistant' terminal/worker/src/index.js
          grep -q 'terminalOperationalAnswer' terminal/worker/src/index.js
          grep -q 'operational_publication_check' terminal/worker/src/index.js
          grep -q 'operational_terminal_diagnostics' terminal/worker/src/index.js
          grep -q 'terminalChatbotDock' terminal/worker/src/index.js
          grep -q 'GITHUB_WORKFLOW_DISPATCH_FAILED' terminal/worker/src/index.js
          grep -q 'GitHub odgovor:' terminal/worker/src/index.js

      - name: Deploy Worker to Cloudflare
        working-directory: terminal/worker
        run: npx wrangler deploy

      - name: Verify live Worker health
        shell: bash
        run: |
          python - <<'PY'
          import json, os, sys, time, urllib.request
          url = "https://blog-lab.dan-grmusa.workers.dev/health"
          expected = os.environ.get("EXPECTED_WORKER_VERSION")
          last = ""
          headers = {
              "User-Agent": "BlogLabWorkerDeployHealth/1.0",
              "Accept": "application/json,text/plain,*/*",
              "Cache-Control": "no-cache",
          }
          for _ in range(18):
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=20) as r:
                      data = json.loads(r.read().decode("utf-8"))
                  print(json.dumps(data, ensure_ascii=False, indent=2))
                  if (
                      data.get("version") == expected
                      and data.get("auth_self_test_ok") is True
                      and int(data.get("authorized_users_ready") or 0) >= 2
                      and data.get("maj_login_ready") is True
                  ):
                      sys.exit(0)
                  last = json.dumps(data, ensure_ascii=False)[:500]
              except Exception as exc:
                  last = str(exc)
              time.sleep(5)
          print("Live Worker health verification failed:", last, file=sys.stderr)
          sys.exit(1)
          PY
