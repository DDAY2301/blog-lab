name: Blog Lab 24h Article Learning

on:
  schedule:
    - cron: "13 * * * *"
  push:
    paths:
      - ".github/workflows/publisher-learning.yml"
      - "agents/blog-lab-publisher/**"
      - "data/agent-state.json"
      - "data/processed-items.json"
      - "logs/**"
  workflow_run:
    workflows:
      - "Blog Lab Publisher Agent"
      - "Blog Lab Publisher Guardian"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-lab-article-learning
  cancel-in-progress: false

jobs:
  article-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      AGENT_ENABLED: true
      PUBLISH_MODE: automatic
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync latest main
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-agent.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-agent.txt

      - name: Run 24h article learning loop
        shell: bash
        run: |
          python -m py_compile agents/blog-lab-publisher/learning_loop.py agents/blog-lab-publisher/services/learning.py agents/blog-lab-publisher/agent.py agents/blog-lab-publisher/autonomous_fallback.py
          python agents/blog-lab-publisher/learning_loop.py --mode continuous

      - name: Commit learning memory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "blog-lab-learning[bot]"
          git config user.email "blog-lab-learning[bot]@users.noreply.github.com"
          git add data/article-learning.json public/data/article-learning-status.json
          if git diff --cached --quiet; then
            echo "No learning changes to commit."
            exit 0
          fi
          git commit -m "Learning: update article and news source memory"
          git pull --rebase origin main
          git push origin HEAD:main
