name: Blog Lab Health Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "11 */6 * * *"
  workflow_dispatch:

concurrency:
  group: blog-lab-health
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-agent.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          pip install -r requirements-agent.txt
          npm ci
      - name: Compile agent code
        run: python -m py_compile agents/operator-terminal/*.py agents/blog-lab-publisher/agent.py agents/blog-lab-publisher/services/*.py
      - name: Run agent tests
        run: pytest -q agents/operator-terminal/tests agents/blog-lab-publisher/tests
      - name: Check critical frontend component wiring
        shell: bash
        run: |
          if grep -Fq '<LivePulse' src/App.jsx; then
            grep -Fq 'import LivePulse from "./LivePulse";' src/App.jsx || {
              echo "::error::LivePulse is rendered but not imported in src/App.jsx."
              exit 1
            }
          fi
      - name: Build public site
        run: npm run build
      - name: Runtime-render public site in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/vite-preview.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/blog-lab/ >/dev/null; then break; fi
            sleep 1
          done
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$BROWSER" ]]; then
            echo "::error::No headless browser is available on the runner."
            exit 1
          fi
          "$BROWSER" --headless --disable-gpu --no-sandbox --virtual-time-budget=5000 --dump-dom             http://127.0.0.1:4173/blog-lab/ > "$RUNNER_TEMP/rendered-dom.html"
          grep -Fq 'Blog Lab' "$RUNNER_TEMP/rendered-dom.html" || {
            echo "::error::React runtime did not render Blog Lab."
            cat "$RUNNER_TEMP/vite-preview.log"
            exit 1
          }
          SHOW_LIVE="$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('public/site-settings.json','utf8')); process.stdout.write(String(x.showLivePulse !== false))")"
          if [[ "$SHOW_LIVE" == "true" ]]; then
            grep -Fq 'TEKOČE' "$RUNNER_TEMP/rendered-dom.html" || {
              echo "::error::LivePulse is enabled but did not render in the browser."
              cat "$RUNNER_TEMP/vite-preview.log"
              exit 1
            }
          fi
      - name: Parse Worker embedded browser JavaScript
        run: node scripts/test-worker-browser-js.mjs
      - name: Test Worker auth on a fresh device
        run: node scripts/test-worker-auth.mjs
      - name: Test terminal Worker API routes
        run: node scripts/test-worker-routes.mjs
      - name: Bundle Cloudflare Worker
        run: npx wrangler deploy --dry-run
      - name: Scan tracked files for obvious credentials
        shell: bash
        run: |
          if git grep -I -n -E "(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,})" -- . ':(exclude)package-lock.json'; then
            echo "Credential-like material detected in tracked repository files."
            exit 1
          fi
