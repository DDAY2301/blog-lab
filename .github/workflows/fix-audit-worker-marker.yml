name: One-shot audit Worker marker fix

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-audit-worker-marker.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch audit marker and remove this workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('agents/audit/deep_audit.py')
          text = path.read_text(encoding='utf-8')
          old = '"auth-v6.17-ai-resilience",'
          new = '"auth-v6.19-login-hardening",'
          if old not in text:
              raise SystemExit('old worker marker not found or already patched')
          path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/fix-audit-worker-marker.yml').unlink(missing_ok=True)
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "DDAY2301"
          git config user.email "135416858+DDAY2301@users.noreply.github.com"
          git add agents/audit/deep_audit.py .github/workflows/fix-audit-worker-marker.yml
          git commit -m "Fix audit Worker version marker"
          git push
