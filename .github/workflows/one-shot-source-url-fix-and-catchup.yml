name: One-shot source URL fix and aktualno catch-up

on:
  push:
    paths:
      - ".github/workflows/one-shot-source-url-fix-and-catchup.yml"
  workflow_dispatch:

permissions:
  contents: write
  copilot-requests: write

jobs:
  fix-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      AGENT_ENABLED: true
      PUBLISH_MODE: automatic
      AI_PROVIDER: auto
      WORKER_AI_URL: https://blog-lab.dan-grmusa.workers.dev/api/ai/write
      WORKER_AI_TOKEN: ${{ secrets.TERMINAL_COMMAND_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      MODEL_BASE_URL: ${{ secrets.MODEL_BASE_URL }}
      MODEL_NAME: ${{ secrets.MODEL_NAME }}
      GITHUB_TOKEN: ${{ github.token }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Sync latest main
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Patch source URL filtering and gitignore
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('agents/blog-lab-publisher/agent.py')
          text = path.read_text(encoding='utf-8')
          old = '    seen = {x.get("hash") for x in processed}; fresh = [x for x in items if x.get("hash") not in seen]\n'
          new = '''    seen = {x.get("hash") for x in processed}\n    used_processed_urls = {\n        str(x.get("url") or "").strip()\n        for x in processed\n        if str(x.get("url") or "").strip()\n    }\n    fresh = [\n        x for x in items\n        if x.get("hash") not in seen\n        and str(x.get("url") or "").strip() not in used_processed_urls\n    ]\n'''
          if old not in text:
              raise SystemExit('Target source freshness line not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.gitignore')
          text = path.read_text(encoding='utf-8') if path.exists() else ''
          additions = ['__pycache__/', '*.py[cod]', '.pytest_cache/']
          for item in additions:
              if item not in text.splitlines():
                  text += ('' if text.endswith('\n') or not text else '\n') + item + '\n'
          path.write_text(text, encoding='utf-8')
          PY
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-agent.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          pip install -r requirements-agent.txt
          npm ci
      - name: Validate patch
        shell: bash
        run: |
          python -m py_compile agents/blog-lab-publisher/agent.py agents/blog-lab-publisher/services/*.py
          pytest -q agents/blog-lab-publisher/tests/test_ai_provider_availability.py agents/blog-lab-publisher/tests/test_local_evidence_ai.py
      - name: Publish aktualno again with unused sources
        shell: bash
        run: |
          python agents/blog-lab-publisher/agent.py --category aktualno --scheduled-slot "2026-09-20|19:43|aktualno"
          if git diff --quiet -- src/App.jsx; then
            echo "Agent did not write article; running deterministic fallback."
            python agents/blog-lab-publisher/autonomous_fallback.py --category aktualno --scheduled-slot "2026-09-20|19:43|aktualno"
          fi
      - name: Build and scan
        shell: bash
        run: |
          npm run build
          if git grep -I -n -E "(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,})" -- . ':(exclude)package-lock.json'; then
            exit 1
          fi
      - name: Cleanup generated Python caches and commit
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type d -name .pytest_cache -prune -exec rm -rf {} +
          rm -f .github/workflows/one-shot-source-url-fix-and-catchup.yml
          git config user.name "blog-lab-publisher[bot]"
          git config user.email "blog-lab-publisher[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix source URL reuse and publish aktualno catch-up"
          git pull --rebase origin main
          git push origin HEAD:main
