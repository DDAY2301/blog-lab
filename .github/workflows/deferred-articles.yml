name: Blog Lab Deferred Articles

on:
  schedule:
    - cron: "29 * * * *"
  workflow_dispatch:
    inputs:
      max_items:
        description: "Maximum deferred manual articles to replay"
        required: false
        default: "2"
        type: string

concurrency:
  group: blog-lab-deferred-articles
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  copilot-requests: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TERMINAL_COMMAND_KEY: ${{ secrets.TERMINAL_COMMAND_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      AGENT_ENABLED: ${{ vars.AGENT_ENABLED || 'true' }}
      PUBLISH_MODE: ${{ vars.PUBLISH_MODE || 'automatic' }}
      AI_PROVIDER: "auto"
      WORKER_AI_URL: "https://blog-lab.dan-grmusa.workers.dev/api/ai/write"
      WORKER_AI_TOKEN: ${{ secrets.TERMINAL_COMMAND_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      MODEL_BASE_URL: ${{ secrets.MODEL_BASE_URL }}
      MODEL_NAME: ${{ secrets.MODEL_NAME }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync latest main
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-agent.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          pip install -r requirements-agent.txt
          npm ci
          npm install -g @github/copilot@latest

      - name: Validate article tools
        shell: bash
        run: |
          python -m py_compile agents/operator-terminal/*.py agents/blog-lab-publisher/agent.py agents/blog-lab-publisher/services/*.py
          pytest -q agents/operator-terminal/tests agents/blog-lab-publisher/tests

      - name: Replay deferred articles
        shell: bash
        env:
          MAX_ITEMS: ${{ github.event.inputs.max_items || '2' }}
        run: |
          set -euo pipefail
          python agents/operator-terminal/deferred_articles.py replay --max "$MAX_ITEMS"

      - name: Clean runner-only Python bytecode
        shell: bash
        run: |
          find agents -type d -name __pycache__ -prune -exec rm -rf {} +
          find agents -type f -name '*.pyc' -delete

      - name: Reject protected security-path changes
        shell: bash
        run: |
          CHANGED="$(
            git diff --name-only
            git ls-files --others --exclude-standard
          )"
          if printf '%s\n' "$CHANGED" | grep -Eq '^(\.github/|terminal/|agents/operator-terminal/|AGENTS\.md$|requirements-agent\.txt$|\.env)'; then
            echo "Protected path changed during deferred article replay."
            printf '%s\n' "$CHANGED"
            exit 1
          fi

      - name: Ensure no obvious credentials were written
        shell: bash
        run: |
          if git grep -I -n -E "(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,})" -- . ':(exclude)package-lock.json'; then
            echo "Credential-like material detected in tracked repository files."
            exit 1
          fi

      - name: Detect published article change
        id: content
        shell: bash
        run: |
          if git diff --quiet -- src/App.jsx; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Validate frontend build when article changed
        if: ${{ steps.content.outputs.changed == 'true' }}
        run: npm run build

      - name: Commit replay result
        shell: bash
        run: |
          if git diff --quiet && [[ -z "$(git status --porcelain)" ]]; then echo "No deferred article changes."; exit 0; fi
          git config user.name "blog-lab-deferred-article[bot]"
          git config user.email "blog-lab-deferred-article[bot]@users.noreply.github.com"
          git add -A -- src/App.jsx data public/data
          for optional_path in content/drafts logs; do
            if [[ -e "$optional_path" ]]; then
              git add -A -- "$optional_path"
            fi
          done
          if git diff --cached --quiet; then
            echo "No permitted deferred article changes to commit."
            exit 0
          fi
          git commit -m "Terminal: replay deferred manual article"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Configure Pages
        if: ${{ steps.content.outputs.changed == 'true' }}
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: ${{ steps.content.outputs.changed == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        if: ${{ steps.content.outputs.changed == 'true' }}
        id: deployment
        uses: actions/deploy-pages@v5
