name: One-shot publisher fallback fix and sport catch-up

on:
  push:
    paths:
      - ".github/workflows/one-shot-fix-publisher-fallback-and-catchup.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  copilot-requests: write

concurrency:
  group: one-shot-publisher-fallback-fix
  cancel-in-progress: false

jobs:
  fix-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      AGENT_ENABLED: true
      PUBLISH_MODE: automatic
      AI_PROVIDER: auto
      WORKER_AI_URL: https://blog-lab.dan-grmusa.workers.dev/api/ai/write
      WORKER_AI_TOKEN: ${{ secrets.TERMINAL_COMMAND_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      MODEL_BASE_URL: ${{ secrets.MODEL_BASE_URL }}
      MODEL_NAME: ${{ secrets.MODEL_NAME }}
      GITHUB_TOKEN: ${{ github.token }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync latest main
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Patch publisher fallback condition safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/agent-blog-lab-publisher.yml')
          text = path.read_text(encoding='utf-8')
          old = "        if: " + "$" + "{{ github.event_name != 'workflow_dispatch' || inputs.catch_up == true }}\n"
          new = "        if: " + "$" + "{{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}\n"
          if old in text:
              text = text.replace(old, new, 1)
          elif new in text:
              pass
          else:
              raise SystemExit('Fallback condition target not found')
          path.write_text(text, encoding='utf-8')
          PY

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-agent.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          pip install -r requirements-agent.txt
          npm ci

      - name: Validate publisher
        run: |
          python -m py_compile agents/blog-lab-publisher/agent.py agents/blog-lab-publisher/autonomous_fallback.py agents/blog-lab-publisher/services/*.py agents/blog-lab-publisher/schedule.py
          pytest -q agents/blog-lab-publisher/tests

      - name: Publish missed 08:17 sport slot
        shell: bash
        run: |
          python agents/blog-lab-publisher/agent.py --category sport --scheduled-slot "2026-09-21|08:17|sport"
          if git diff --quiet -- src/App.jsx; then
            echo "No article content change detected; running deterministic fallback."
            python agents/blog-lab-publisher/autonomous_fallback.py --category sport --scheduled-slot "2026-09-21|08:17|sport"
          fi

      - name: Build and scan
        shell: bash
        run: |
          npm run build
          if git grep -I -n -E "(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,})" -- . ':(exclude)package-lock.json'; then
            exit 1
          fi

      - name: Cleanup caches and commit
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type d -name .pytest_cache -prune -exec rm -rf {} +
          rm -f .github/workflows/one-shot-fix-publisher-fallback-and-catchup.yml
          git config user.name "blog-lab-publisher[bot]"
          git config user.email "blog-lab-publisher[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix publisher fallback and publish missed sport slot"
          git pull --rebase origin main
          git push origin HEAD:main
