name: One-shot repair wrong sports article and guarded catch-up

on:
  push:
    paths:
      - ".github/workflows/one-shot-fix-publisher-fallback-and-catchup.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: one-shot-publisher-fallback-fix
  cancel-in-progress: true

jobs:
  repair-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      AGENT_ENABLED: true
      PUBLISH_MODE: automatic
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync latest main
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-agent.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          pip install -r requirements-agent.txt
          npm ci

      - name: Remove wrong-category Susskind article and reset sport slot
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          bad_id = "leonard-susskind-leinweber-institute-for-theoretical-physics-3f240bfe"
          app = Path("src/App.jsx")
          text = app.read_text(encoding="utf-8")

          def remove_article(src: str, article_id: str) -> str:
              needle = f'"id": "{article_id}"'
              idx = src.find(needle)
              if idx < 0:
                  return src
              start = src.rfind("\n  {", 0, idx)
              if start < 0:
                  start = src.rfind("{", 0, idx)
              obj_start = src.find("{", start)
              depth = 0
              in_str = False
              esc = False
              end = None
              for pos in range(obj_start, len(src)):
                  ch = src[pos]
                  if in_str:
                      if esc:
                          esc = False
                      elif ch == "\\":
                          esc = True
                      elif ch == '"':
                          in_str = False
                      continue
                  if ch == '"':
                      in_str = True
                  elif ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          end = pos + 1
                          break
              if end is None:
                  raise RuntimeError("Could not find end of bad article object")
              j = end
              if j < len(src) and src[j] == ",":
                  j += 1
              while j < len(src) and src[j] in " \t\r\n":
                  j += 1
              prefix = src[:start]
              if not prefix.endswith("\n"):
                  prefix += "\n"
              return prefix + src[j:]

          new_text = remove_article(text, bad_id)
          if new_text != text:
              app.write_text(new_text, encoding="utf-8")
              print("REMOVED_BAD_ARTICLE", bad_id)
          else:
              print("BAD_ARTICLE_NOT_FOUND", bad_id)

          processed_path = Path("data/processed-items.json")
          if processed_path.exists():
              processed = json.loads(processed_path.read_text(encoding="utf-8") or "[]")
              processed = [item for item in processed if item.get("output_id") != bad_id]
              processed_path.write_text(json.dumps(processed, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          state_path = Path("data/agent-state.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          state.update({
              "posts_date": "2026-09-21",
              "posts_today": 0,
              "scheduled_posts_today": 0,
              "manual_posts_today": state.get("manual_posts_today", 0),
              "last_output": None,
              "last_error": "removed_wrong_category_article",
              "current_category": "sport",
              "writer_mode": "repairing_category_guard",
              "scheduled_slots_done": [],
              "scheduled_slots_deferred": [],
              "last_editorial_hold": None,
          })
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Compile guarded fallback publisher
        run: |
          python -m py_compile agents/blog-lab-publisher/autonomous_fallback.py agents/blog-lab-publisher/services/*.py agents/blog-lab-publisher/schedule.py

      - name: Run guarded sport catch-up
        shell: bash
        run: |
          python agents/blog-lab-publisher/autonomous_fallback.py --category sport --scheduled-slot "2026-09-21|08:17|sport"

      - name: Build and scan
        shell: bash
        run: |
          npm run build
          if git grep -I -n -E "(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,})" -- . ':(exclude)package-lock.json'; then
            exit 1
          fi

      - name: Commit repaired article and state only
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type d -name .pytest_cache -prune -exec rm -rf {} +
          git config user.name "blog-lab-publisher[bot]"
          git config user.email "blog-lab-publisher[bot]@users.noreply.github.com"
          git add -A -- src/App.jsx data public/data || true
          for optional_path in content/drafts logs; do
            if [[ -e "$optional_path" ]]; then
              git add -A -- "$optional_path"
            fi
          done
          if git diff --cached --quiet; then
            echo "No article/state changes to commit."
            exit 0
          fi
          git commit -m "Agent: repair wrong sport article and rerun guarded catch-up"
          git pull --rebase origin main
          git push origin HEAD:main
