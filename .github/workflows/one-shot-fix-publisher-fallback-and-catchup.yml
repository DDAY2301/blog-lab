name: One-shot sport catch-up content only

on:
  push:
    paths:
      - ".github/workflows/one-shot-fix-publisher-fallback-and-catchup.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: one-shot-publisher-fallback-fix
  cancel-in-progress: true

jobs:
  publish-content:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      AGENT_ENABLED: true
      PUBLISH_MODE: automatic
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync latest main
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-agent.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          pip install -r requirements-agent.txt
          npm ci

      - name: Compile fallback publisher
        run: |
          python -m py_compile agents/blog-lab-publisher/autonomous_fallback.py agents/blog-lab-publisher/services/*.py agents/blog-lab-publisher/schedule.py

      - name: Publish missed 08:17 sport slot with deterministic fallback
        shell: bash
        run: |
          python agents/blog-lab-publisher/autonomous_fallback.py --category sport --scheduled-slot "2026-09-21|08:17|sport"

      - name: Build and scan
        shell: bash
        run: |
          npm run build
          if git grep -I -n -E "(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,})" -- . ':(exclude)package-lock.json'; then
            exit 1
          fi

      - name: Commit article and state only
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type d -name .pytest_cache -prune -exec rm -rf {} +
          git config user.name "blog-lab-publisher[bot]"
          git config user.email "blog-lab-publisher[bot]@users.noreply.github.com"
          git add -A -- src/App.jsx data public/data || true
          for optional_path in content/drafts logs; do
            if [[ -e "$optional_path" ]]; then
              git add -A -- "$optional_path"
            fi
          done
          if git diff --cached --quiet; then
            echo "No article/state changes to commit."
            exit 0
          fi
          git commit -m "Agent: publish missed sport slot"
          git pull --rebase origin main
          git push origin HEAD:main
