name: Blog Lab Publisher Agent

on:
  # GitHub cron is UTC. Each local Ljubljana slot has a CET and CEST
  # candidate; the lightweight plan job below enables only the one that
  # matches the current Europe/Ljubljana UTC offset.
  schedule:
    - cron: "17 6 * * *"
    - cron: "17 7 * * *"
    - cron: "27 11 * * *"
    - cron: "27 12 * * *"
    - cron: "43 17 * * *"
    - cron: "43 18 * * *"
  workflow_dispatch:
    inputs:
      category:
        description: "Kategorija članka"
        required: true
        default: "aktualno"
        type: choice
        options: [sport, politika, aktualno]
      dry_run:
        description: "Samo test, brez objave"
        required: false
        default: false
        type: boolean
      force:
        description: "Prezri dnevno omejitev"
        required: false
        default: false
        type: boolean

concurrency:
  group: blog-lab-publisher
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  copilot-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.plan.outputs.run }}
      category: ${{ steps.plan.outputs.category }}
    steps:
      - id: plan
        name: Resolve Ljubljana slot
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_CATEGORY: ${{ inputs.category }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "category=${INPUT_CATEGORY:-aktualno}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OFFSET="$(TZ=Europe/Ljubljana date +%z)"
          RUN=false
          CATEGORY=aktualno
          case "$EVENT_SCHEDULE" in
            "17 6 * * *") [[ "$OFFSET" == "+0200" ]] && RUN=true; CATEGORY=sport ;;
            "17 7 * * *") [[ "$OFFSET" == "+0100" ]] && RUN=true; CATEGORY=sport ;;
            "27 11 * * *") [[ "$OFFSET" == "+0200" ]] && RUN=true; CATEGORY=politika ;;
            "27 12 * * *") [[ "$OFFSET" == "+0100" ]] && RUN=true; CATEGORY=politika ;;
            "43 17 * * *") [[ "$OFFSET" == "+0200" ]] && RUN=true; CATEGORY=aktualno ;;
            "43 18 * * *") [[ "$OFFSET" == "+0100" ]] && RUN=true; CATEGORY=aktualno ;;
          esac
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "category=$CATEGORY" >> "$GITHUB_OUTPUT"
          echo "Ljubljana offset=$OFFSET schedule=$EVENT_SCHEDULE run=$RUN category=$CATEGORY"

  run-agent:
    needs: plan
    if: ${{ needs.plan.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      AGENT_ENABLED: ${{ vars.AGENT_ENABLED || 'true' }}
      PUBLISH_MODE: ${{ vars.PUBLISH_MODE || 'automatic' }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'auto' }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      MODEL_BASE_URL: ${{ secrets.MODEL_BASE_URL }}
      MODEL_NAME: ${{ secrets.MODEL_NAME }}
      GITHUB_TOKEN: ${{ github.token }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Sync latest main
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-agent.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install agent dependencies
        run: |
          pip install -r requirements-agent.txt
          npm install -g @github/copilot@latest
      - name: Install frontend dependencies
        run: npm ci
      - name: Test agent
        run: |
          python -m py_compile agents/blog-lab-publisher/agent.py agents/blog-lab-publisher/services/*.py
          pytest -q agents/blog-lab-publisher/tests
      - name: Select editorial category
        shell: bash
        run: |
          CATEGORY="${{ needs.plan.outputs.category }}"
          echo "RUN_CATEGORY=$CATEGORY" >> "$GITHUB_ENV"
          echo "Selected Ljubljana category: $CATEGORY"
      - name: Run autonomous publisher
        shell: bash
        run: |
          ARGS=(--category "$RUN_CATEGORY")
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then ARGS+=(--manual); fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then ARGS+=(--dry-run); fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force }}" == "true" ]]; then ARGS+=(--force); fi
          python agents/blog-lab-publisher/agent.py "${ARGS[@]}"
      - name: Verify frontend build
        run: npm run build
      - name: Ensure no obvious credentials were written
        shell: bash
        run: |
          if git grep -I -n -E "(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,})" -- . ':(exclude)package-lock.json'; then
            echo "Credential-like material detected in tracked repository files."
            exit 1
          fi
      - name: Detect published-content change
        id: content
        shell: bash
        run: |
          if git diff --quiet -- src/App.jsx; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Commit verified agent state/content
        id: commit
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        shell: bash
        run: |
          echo "changed=false" >> "$GITHUB_OUTPUT"
          if git diff --quiet && [[ -z "$(git status --porcelain)" ]]; then exit 0; fi
          git config user.name "blog-lab-publisher[bot]"
          git config user.email "blog-lab-publisher[bot]@users.noreply.github.com"
          git add -A -- src/App.jsx data public/data
          for optional_path in content/drafts logs; do
            if [[ -e "$optional_path" ]]; then
              git add -A -- "$optional_path"
            fi
          done
          if git diff --cached --quiet; then
            echo "::error::Agent produced repository changes, but no allowed changes were staged."
            git status --short
            exit 1
          fi
          git commit -m "Agent: publish $RUN_CATEGORY Blog Lab update"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Final synchronized article build
        if: ${{ steps.content.outputs.changed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false) }}
        run: npm run build
      - name: Configure GitHub Pages
        if: ${{ steps.content.outputs.changed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false) }}
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: ${{ steps.content.outputs.changed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false) }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy generated article to GitHub Pages
        id: deployment
        if: ${{ steps.content.outputs.changed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false) }}
        uses: actions/deploy-pages@v5
