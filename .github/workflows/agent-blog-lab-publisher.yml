name: Blog Lab Publisher Agent

on:
  # Četrturni heartbeat razreši pet lokalnih slotov v Europe/Ljubljana.
  # Tako ostane urnik pravilen tudi pri prehodu CET/CEST in zamudah GitHub schedulerja.
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      category:
        description: "Kategorija članka"
        required: true
        default: "sezonsko"
        type: choice
        options: [kolesarstvo, dediscina, sezonsko, gore, gourmet]
      dry_run:
        description: "Samo test, brez objave"
        required: false
        default: false
        type: boolean
      force:
        description: "Prezri dnevno omejitev"
        required: false
        default: false
        type: boolean
      catch_up:
        description: "Interni catch-up scheduler"
        required: false
        default: false
        type: boolean

concurrency:
  group: blog-lab-publisher
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  copilot-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.plan.outputs.run }}
      category: ${{ steps.plan.outputs.category }}
      slot: ${{ steps.plan.outputs.slot }}
      slot_time: ${{ steps.plan.outputs.slot_time }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        name: Resolve due Ljubljana slot
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CATEGORY: ${{ inputs.category }}
          INPUT_CATCH_UP: ${{ inputs.catch_up }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_CATCH_UP" != "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "category=${INPUT_CATEGORY:-sezonsko}" >> "$GITHUB_OUTPUT"
            echo "slot=" >> "$GITHUB_OUTPUT"
            echo "slot_time=" >> "$GITHUB_OUTPUT"
            echo "reason=manual_dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 agents/blog-lab-publisher/schedule.py --github-output "$GITHUB_OUTPUT"

  run-agent:
    needs: plan
    if: ${{ needs.plan.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      AGENT_ENABLED: ${{ vars.AGENT_ENABLED || 'true' }}
      PUBLISH_MODE: ${{ vars.PUBLISH_MODE || 'automatic' }}
      AI_PROVIDER: "auto"
      LOCAL_MODEL_ENABLED: ${{ vars.LOCAL_MODEL_ENABLED || 'false' }}
      LOCAL_MODEL_BASE_URL: ${{ vars.LOCAL_MODEL_BASE_URL }}
      LOCAL_MODEL_API_KEY: ${{ secrets.LOCAL_MODEL_API_KEY }}
      LOCAL_GENERAL_MODEL: ${{ vars.LOCAL_GENERAL_MODEL || 'bloglab-qwen36-efficient' }}
      LOCAL_CODER_MODEL: ${{ vars.LOCAL_CODER_MODEL || 'bloglab-katcoder-efficient' }}
      LOCAL_MODEL_TIMEOUT: ${{ vars.LOCAL_MODEL_TIMEOUT || '300' }}
      WORKER_AI_URL: "https://blog-lab.dan-grmusa.workers.dev/api/ai/write"
      WORKER_AI_TOKEN: ${{ secrets.TERMINAL_COMMAND_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      MODEL_BASE_URL: ${{ secrets.MODEL_BASE_URL }}
      MODEL_NAME: ${{ secrets.MODEL_NAME }}
      GITHUB_TOKEN: ${{ github.token }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Sync latest main
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-agent.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install agent dependencies
        run: |
          pip install -r requirements-agent.txt
          npm install -g @github/copilot@latest
      - name: Install frontend dependencies
        run: npm ci
      - name: Test agent
        run: |
          python -m py_compile agents/blog-lab-publisher/agent.py agents/blog-lab-publisher/autonomous_fallback.py agents/blog-lab-publisher/services/*.py
          pytest -q agents/blog-lab-publisher/tests
      - name: Select editorial category
        shell: bash
        run: |
          CATEGORY="${{ needs.plan.outputs.category }}"
          SLOT="${{ needs.plan.outputs.slot }}"
          echo "RUN_CATEGORY=$CATEGORY" >> "$GITHUB_ENV"
          echo "RUN_SCHEDULE_SLOT=$SLOT" >> "$GITHUB_ENV"
          echo "Selected Ljubljana category: $CATEGORY · slot: ${SLOT:-manual}"
      - name: Run autonomous publisher
        shell: bash
        run: |
          ARGS=(--category "$RUN_CATEGORY")
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.catch_up }}" != "true" ]]; then
            ARGS+=(--manual)
          elif [[ -n "$RUN_SCHEDULE_SLOT" ]]; then
            ARGS+=(--scheduled-slot "$RUN_SCHEDULE_SLOT")
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.catch_up }}" != "true" && "${{ inputs.dry_run }}" == "true" ]]; then ARGS+=(--dry-run); fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.catch_up }}" != "true" && "${{ inputs.force }}" == "true" ]]; then ARGS+=(--force); fi
          python agents/blog-lab-publisher/agent.py "${ARGS[@]}"
      - name: Run deterministic fallback if no article was written
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.catch_up == true }}
        shell: bash
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo "No article content change detected; running deterministic autonomous fallback."
            python agents/blog-lab-publisher/autonomous_fallback.py --category "$RUN_CATEGORY" --scheduled-slot "$RUN_SCHEDULE_SLOT"
          else
            echo "Article content already changed; fallback not needed."
          fi
      - name: Verify frontend build
        run: npm run build
      - name: Ensure no obvious credentials were written
        shell: bash
        run: |
          if git grep -I -n -E "(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,})" -- . ':(exclude)package-lock.json'; then
            echo "Credential-like material detected in tracked repository files."
            exit 1
          fi
      - name: Detect published-content change
        id: content
        shell: bash
        run: |
          if git diff --quiet -- src/App.jsx; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Commit verified agent state/content
        id: commit
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        shell: bash
        run: |
          echo "changed=false" >> "$GITHUB_OUTPUT"
          if git diff --quiet && [[ -z "$(git status --porcelain)" ]]; then exit 0; fi
          git config user.name "blog-lab-publisher[bot]"
          git config user.email "blog-lab-publisher[bot]@users.noreply.github.com"
          git add -A -- src/App.jsx data public/data
          if [[ -d public/media/articles ]]; then git add -A -- public/media/articles; fi
          for optional_path in content/drafts logs; do
            if [[ -e "$optional_path" ]]; then
              git add -A -- "$optional_path"
            fi
          done
          if git diff --cached --quiet; then
            echo "::error::Agent produced repository changes, but no allowed changes were staged."
            git status --short
            exit 1
          fi
          if [[ "${{ steps.content.outputs.changed }}" == "true" ]]; then
            COMMIT_MESSAGE="Agent: publish $RUN_CATEGORY Blog Lab update"
          else
            COMMIT_MESSAGE="Agent: update $RUN_CATEGORY publisher state"
          fi
          git commit -m "$COMMIT_MESSAGE"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Final synchronized article build
        if: ${{ steps.content.outputs.changed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false) }}
        run: npm run build
      - name: Configure GitHub Pages
        if: ${{ steps.content.outputs.changed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false) }}
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: ${{ steps.content.outputs.changed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false) }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy generated article to GitHub Pages
        id: deployment
        if: ${{ steps.content.outputs.changed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false) }}
        uses: actions/deploy-pages@v5
