name: AI Resilience Script Run

on:
  push:
    paths:
      - .github/workflows/ai-resilience-script-run.yml
      - tools/patch_ai_resilience.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply patch
        run: python tools/patch_ai_resilience.py
      - name: Validate
        run: |
          node --check terminal/worker/src/index.js
          python -m py_compile agents/blog-lab-publisher/services/ai_provider.py
          pip install -r requirements-agent.txt
          pytest -q agents/blog-lab-publisher/tests
      - name: Commit patch and cleanup
        run: |
          git config user.name "blog-lab-ai-resilience[bot]"
          git config user.email "blog-lab-ai-resilience[bot]@users.noreply.github.com"
          rm -f tools/patch_ai_resilience.py \
            .github/workflows/ai-resilience-hotfix.yml \
            .github/workflows/ai-resilience-dispatch.yml \
            .github/workflows/ai-resilience-auto.yml \
            .github/workflows/ai-resilience-script-run.yml
          git add -A terminal/worker/src/index.js agents/blog-lab-publisher/services/ai_provider.py docs/ai-resilience.md tools .github/workflows
          git commit -m "Worker: add AI diagnostics and model fallback"
          git pull --rebase origin main
          git push origin HEAD:main
