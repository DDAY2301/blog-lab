name: Import generated Ljubljana paintings once
on:
  push:
    branches:
      - feature/ljubljana-oil-art-assets-20261106
    paths:
      - .github/workflows/import-generated-art.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  add-generated-art:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download approved oil paintings into local public assets
        run: |
          set -euo pipefail
          mkdir -p public/art/painted
          curl --fail --location --silent --show-error --retry 3 'https://media.canva.com/v2/image-resize/format:PNG/height:112/quality:100/uri:ifs%3A%2F%2FM%2F91f45972-fdaa-49cd-91ca-421fd4f67651/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAAEWmGT6fGQ-H1vDC5WWkRkzTMGtj7KQ5Eq-MohVk9Mp&exp=1793977618&osig=AAAAAAAAAAAAAAAAAAAAAGX2QevSfE1hoGAY5EOMNdcZli-nM7E1UoiRC5gMmxHe&signer=media-rpc&token=AAIAAU0AJDkxZjQ1OTcyLWZkYWEtNDljZC05MWNhLTQyMWZkNGY2NzY1MQAAAAABobFmDlBrgp_tUzxTF8ikJQNz5sbAQDqo3GO0TJGmWPU66FwRMQ&x-canva-quality=thumbnail' --output 'public/art/painted/ljubljana-grad.png'
          curl --fail --location --silent --show-error --retry 3 'https://media.canva.com/v2/image-resize/format:PNG/height:112/quality:100/uri:ifs%3A%2F%2FM%2F98160429-f487-40aa-a91f-0181e27a6e90/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAANHBv37XtHgaIBXvJ1I9yFGYEywdKVoPq-A17SDnY2Rd&exp=1793979585&osig=AAAAAAAAAAAAAAAAAAAAAOrAX8oeWPY-qMJuj5EoXMzCvssSq2LzxO2WVV2ZMcTJ&signer=media-rpc&token=AAIAAU0AJDk4MTYwNDI5LWY0ODctNDBhYS1hOTFmLTAxODFlMjdhNmU5MAAAAAABobGEEejm3pisndrdKrSzg7ZpaVflQ6dOJWu0ZOvRpirfkz161w&x-canva-quality=thumbnail' --output 'public/art/painted/ljubljana-tromostovje.png'
          curl --fail --location --silent --show-error --retry 3 'https://media.canva.com/v2/image-resize/format:PNG/height:112/quality:100/uri:ifs%3A%2F%2FM%2F80eead91-adde-4d80-9634-db5746c73256/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAI_4LiSTigwyEILtRsriTh3IFKcE_fws04UVeA7Dv9n7&exp=1793978381&osig=AAAAAAAAAAAAAAAAAAAAAOVUMAJeyZyyt_yBNNAazH5kz1xyVzdjnn8oFjTyHSH-&signer=media-rpc&token=AAIAAU0AJDgwZWVhZDkxLWFkZGUtNGQ4MC05NjM0LWRiNTc0NmM3MzI1NgAAAAABobFxssi8CINR5R3c9hFhTNTHn8HIpF__59QTzQg4uNlEPzt6Ng&x-canva-quality=thumbnail' --output 'public/art/painted/ljubljana-zmajski-most.png'
          curl --fail --location --silent --show-error --retry 3 'https://media.canva.com/v2/image-resize/format:PNG/height:112/quality:100/uri:ifs%3A%2F%2FM%2F7d49e8fb-012f-4eeb-bc9d-cd3c11a71c5e/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAEbxDnYQOjo3J2QFK7fD0zRwycTXDqBG3wXg4VfRVWUS&exp=1793979414&osig=AAAAAAAAAAAAAAAAAAAAAJNBWny28YY8AYEnb86a3O6uKqsH6QujFYVww9uNMlZo&signer=media-rpc&token=AAIAAU0AJDdkNDllOGZiLTAxMmYtNGVlYi1iYzlkLWNkM2MxMWE3MWM1ZQAAAAABobGBdfDccqBkA-aNmra80C3gGW_uC4E77c-81L25ePy0zQPrCA&x-canva-quality=thumbnail' --output 'public/art/painted/ljubljana-ljubljanica.png'
      - name: Validate that images are actual PNG assets
        run: |
          python3 - <<'PY'
          import pathlib,struct
          files=sorted(pathlib.Path("public/art/painted").glob("ljubljana-*.png"))
          assert len(files)==4, f"Expected 4 paintings, found {len(files)}"
          for p in files:
              data=p.read_bytes()
              assert data.startswith(b"\x89PNG\r\n\x1a\n"), f"Invalid PNG: {p}"
              w,h=struct.unpack(">II",data[16:24])
              assert w>=180 and h>=100, f"Too small: {p} ({w}x{h})"
              print(p,w,h,len(data))
          PY
      - name: Commit image assets to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/art/painted/ljubljana-*.png
          git diff --cached --quiet || git commit -m "assets: add four generated Ljubljana oil paintings"
          git push origin HEAD:refs/heads/feature/ljubljana-oil-art-assets-20261106
