name: Agent Manager CI

on:
  pull_request:
    branches: [main, agent-manager-v1, feature/agent-manager-v3]
    paths:
      - "agent-manager/**"
      - ".github/workflows/agent-manager-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent-manager
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-manager/requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile
        run: |
          python -m compileall -q manager run.py

      - name: Tests
        run: |
          python -m pytest -q

      - name: Parse PowerShell lifecycle scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              Write-Host "::error file=$($_.FullName)::$($errors | Out-String)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Scan manager files for obvious committed credentials
        shell: bash
        run: |
          if git grep -I -n -E "(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,})" -- agent-manager; then
            echo "Credential-like material detected in Agent Manager."
            exit 1
          fi

      - name: Agent Manager FastAPI import smoke
        run: |
          python -c "from manager.service_v3 import app; assert app.title.startswith('Agent Manager'); print(app.version)"

      - name: Legacy import compatibility
        run: |
          python -c "from manager.service import app; print(app.version)"

  windows-powershell-51:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate Windows PowerShell 5.1 stack entrypoint
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "This guard must run in classic Windows PowerShell 5.1, not pwsh 7."
          }
          $script = Join-Path $env:GITHUB_WORKSPACE "agent-manager\scripts\start-stack-v4.ps1"
          # Windows PowerShell 5.1 reads BOM-less .ps1 using the system ANSI
          # code page, which can turn UTF-8 punctuation into quote delimiters.
          $bytes = [System.IO.File]::ReadAllBytes($script)
          $nonAscii = @($bytes | Where-Object { $_ -gt 127 })
          if ($nonAscii.Count -gt 0) {
            throw "start-stack-v4.ps1 must remain ASCII-only for Windows PowerShell 5.1 compatibility."
          }
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $script, [ref]$tokens, [ref]$parseErrors
          )
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Host
            throw "Windows PowerShell 5.1 parser rejected start-stack-v4.ps1."
          }
          Write-Host "PASS: Windows PowerShell 5.1 parsed ASCII startup script."
          $emailScript = Join-Path $env:GITHUB_WORKSPACE "agent-manager\scripts\email-control-v7.ps1"
          $emailBytes = [System.IO.File]::ReadAllBytes($emailScript)
          if (@($emailBytes | Where-Object { $_ -gt 127 }).Count -gt 0) {
            throw "email-control-v7.ps1 must remain ASCII-only for Windows PowerShell 5.1."
          }
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $emailScript, [ref]$tokens, [ref]$parseErrors
          )
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Host
            throw "Windows PowerShell 5.1 parser rejected email-control-v7.ps1."
          }
          Write-Host "PASS: Windows PowerShell 5.1 parsed email-control-v7.ps1."
          $v8Script = Join-Path $env:GITHUB_WORKSPACE "agent-manager\scripts\check-manager-v8.ps1"
          $v8Bytes = [System.IO.File]::ReadAllBytes($v8Script)
          if (@($v8Bytes | Where-Object { $_ -gt 127 }).Count -gt 0) {
            throw "check-manager-v8.ps1 must remain ASCII for Windows PowerShell 5.1."
          }
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $v8Script, [ref]$tokens, [ref]$parseErrors
          )
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Host
            throw "Windows PowerShell 5.1 rejected check-manager-v8.ps1."
          }
          Write-Host "PASS: Windows PowerShell 5.1 parsed V8 preflight and activation."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Windows SQLite backup integration with paths containing spaces
        shell: powershell
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE "agent-manager"
          & python -m unittest discover -s agent-manager/tests -p test_v8_sqlite_backup.py -v
          if ($LASTEXITCODE -ne 0) {
            throw "Windows real SQLite backup regression test failed."
          }
