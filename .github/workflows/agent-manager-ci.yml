name: Agent Manager CI

on:
  pull_request:
    branches: [main, agent-manager-v1]
    paths:
      - "agent-manager/**"
      - ".github/workflows/agent-manager-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent-manager
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-manager/requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile
        run: |
          python -m compileall -q manager run.py

      - name: Tests
        run: |
          python -m pytest -q

      - name: V3 FastAPI import smoke
        run: |
          python -c "from manager.service_v3 import app; assert app.title == 'Agent Manager V3'; print(app.version)"

      - name: Legacy import compatibility
        run: |
          python -c "from manager.service import app; print(app.version)"
