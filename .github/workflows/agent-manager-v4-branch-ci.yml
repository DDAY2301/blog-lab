name: Agent Manager V4 Branch CI

on:
  push:
    branches:
      - feature/agent-manager-v4-colibri-maintenance
    paths:
      - "agent-manager/**"
      - ".github/workflows/agent-manager-v4-branch-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: agent-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-manager/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q manager run.py
      - name: Tests
        run: python -m pytest -q
      - name: Parse PowerShell
        shell: pwsh
        run: |
          $failed=$false
          Get-ChildItem scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens=$null
            $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){
              foreach($e in $errors){ Write-Host "::error file=$($_.FullName)::$($e.Message) [$($e.Extent.Text)]" }
              $failed=$true
            }
          }
          if($failed){ exit 1 }
      - name: Secret hygiene
        shell: bash
        run: |
          if git grep -I -n -E "(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,})" -- .; then
            echo "Credential-like material detected."
            exit 1
          fi
      - name: API smoke
        run: python -c "from manager.service_v3 import app; assert app.version == '4.0.0'; print(app.title, app.version)"
