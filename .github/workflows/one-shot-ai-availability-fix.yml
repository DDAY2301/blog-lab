name: One-shot AI availability fix

on:
  push:
    paths:
      - ".github/workflows/one-shot-ai-availability-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Patch Copilot auto-provider availability
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('agents/blog-lab-publisher/services/ai_provider.py')
          text = path.read_text(encoding='utf-8')
          if 'def _copilot_token_ready()' not in text:
              text = text.replace(
                  '\ndef _copilot(prompt: str) -> dict:\n',
                  '''\n\ndef _copilot_token_ready() -> bool:\n    return bool(\n        os.getenv("COPILOT_GITHUB_TOKEN", "").strip()\n        or os.getenv("GITHUB_TOKEN", "").strip()\n        or os.getenv("GH_TOKEN", "").strip()\n    )\n\ndef _copilot(prompt: str) -> dict:\n'''
              )
          old = '''    copilot_token = os.getenv("COPILOT_GITHUB_TOKEN", "").strip()\n    if copilot_token:\n        # Prefer the dedicated Copilot-capable token when configured. The CLI\n        # reads GH_TOKEN/GITHUB_TOKEN; keeping this subprocess-local avoids\n        # changing credentials used by git/GitHub Actions itself.\n        env["GH_TOKEN"] = copilot_token\n        env["GITHUB_TOKEN"] = copilot_token\n'''
          new = '''    copilot_token = os.getenv("COPILOT_GITHUB_TOKEN", "").strip()\n    if copilot_token:\n        # Prefer the dedicated Copilot-capable token when configured. The CLI\n        # reads GH_TOKEN/GITHUB_TOKEN; keeping this subprocess-local avoids\n        # changing credentials used by git/GitHub Actions itself.\n        env["GH_TOKEN"] = copilot_token\n        env["GITHUB_TOKEN"] = copilot_token\n    else:\n        github_token = os.getenv("GITHUB_TOKEN", "").strip() or os.getenv("GH_TOKEN", "").strip()\n        if github_token:\n            env.setdefault("GH_TOKEN", github_token)\n            env.setdefault("GITHUB_TOKEN", github_token)\n'''
          if old in text:
              text = text.replace(old, new)
          text = text.replace('copilot_ready = bool(os.getenv("COPILOT_GITHUB_TOKEN", "").strip())', 'copilot_ready = _copilot_token_ready()')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Add regression tests
        shell: bash
        run: |
          set -euo pipefail
          test_path='agents/blog-lab-publisher/tests/test_ai_provider_availability.py'
          cat > "$test_path" <<'PY'
          import importlib.util
          import pathlib
          import sys

          ROOT = pathlib.Path(__file__).resolve().parents[3]
          MODULE_PATH = ROOT / "agents" / "blog-lab-publisher" / "services" / "ai_provider.py"

          spec = importlib.util.spec_from_file_location("ai_provider_availability", MODULE_PATH)
          ai_provider = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = ai_provider
          spec.loader.exec_module(ai_provider)


          def test_copilot_auto_ready_with_github_token(monkeypatch):
              monkeypatch.delenv("COPILOT_GITHUB_TOKEN", raising=False)
              monkeypatch.setenv("GITHUB_TOKEN", "github-actions-token")
              assert ai_provider._copilot_token_ready() is True


          def test_copilot_auto_ready_with_dedicated_token(monkeypatch):
              monkeypatch.setenv("COPILOT_GITHUB_TOKEN", "copilot-token")
              monkeypatch.delenv("GITHUB_TOKEN", raising=False)
              assert ai_provider._copilot_token_ready() is True


          def test_copilot_auto_not_ready_without_token(monkeypatch):
              monkeypatch.delenv("COPILOT_GITHUB_TOKEN", raising=False)
              monkeypatch.delenv("GITHUB_TOKEN", raising=False)
              monkeypatch.delenv("GH_TOKEN", raising=False)
              assert ai_provider._copilot_token_ready() is False
          PY
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile agents/blog-lab-publisher/services/ai_provider.py
          pip install -r requirements-agent.txt
          pytest -q agents/blog-lab-publisher/tests/test_ai_provider_availability.py
      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "blog-lab-maintenance[bot]"
          git config user.email "blog-lab-maintenance[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-shot-ai-availability-fix.yml
          git add agents/blog-lab-publisher/services/ai_provider.py agents/blog-lab-publisher/tests/test_ai_provider_availability.py .github/workflows/one-shot-ai-availability-fix.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix Copilot AI auto-provider availability"
          git pull --rebase origin main
          git push origin HEAD:main
