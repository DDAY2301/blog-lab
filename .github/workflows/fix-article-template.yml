name: Fix Article Template

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-article-template.yml"
      - ".github/scripts/fix_article_template.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Patch article template
        run: python .github/scripts/fix_article_template.py
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Guardian check
        run: npm run guardian:check
      - name: Verify patch
        run: |
          grep -q "10 idej za dober obisk restavracij v Ljubljani v 2026" src/App.jsx
          grep -q "function ArticleTemplate" src/App.jsx
          grep -q "sign-in-to-your-account-4b374c6" src/App.jsx
          grep -q "Blog Lab article template upgrade v1" src/styles.css
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "blog-lab-maintenance[bot]"
          git config user.email "blog-lab-maintenance[bot]@users.noreply.github.com"
          git add src/App.jsx src/styles.css
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Improve article template and repair restaurant post"
          git push
