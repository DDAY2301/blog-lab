name: Fix Article Template

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-article-template.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Patch article template and post
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          app = Path('src/App.jsx')
          text = app.read_text(encoding='utf-8')
          article = '''  {\n    id: "sign-in-to-your-account-4b374c63",\n    aliases: ["sign-in-to-your-account-4b374c6"],\n    title: "10 idej za dober obisk restavracij v Ljubljani v 2026",\n    excerpt: "Praktičen vodič po ljubljanski kulinarični sceni: kako izbrati pravi lokal za večerjo, kosilo, goste iz tujine ali sproščen mestni obisk.",\n    seoDescription: "Vodnik po restavracijah v Ljubljani v 2026 z javnimi viri Visit Ljubljana in Michelin.",\n    content: `# 10 idej za dober obisk restavracij v Ljubljani v 2026\n\nLjubljana ima dovolj močno kulinarično sceno, da izbira restavracije ne sme temeljiti samo na prvem naključnem seznamu. Boljši pristop je preprost: najprej določi priložnost, nato preveri zanesljive javne vire in šele na koncu rezerviraj konkreten termin.\n\nTa članek ni lestvica in ne razglaša ene najboljše restavracije. Namen je bolj uporaben: pokazati, kako izbrati dober lokal v Ljubljani glede na namen obiska, čas, družbo in pričakovanja.\n\n## 1. Za posebno večerjo začni pri vodnikih\n\nZa obletnico, poslovnega gosta ali degustacijski večer preveri Michelinov izbor za Slovenijo 2026 in Gault&Millau Slovenija 2026. Taki vodniki so koristni, ker dajejo širši uredniški okvir, ne samo posameznih spletnih ocen.\n\n## 2. Za prvi obisk mesta naj šteje tudi lokacija\n\nČe je obisk Ljubljane kratek, izberi restavracijo, ki se ujema s potjo po mestu. Center, okolica tržnice, Ljubljanica in staro mestno jedro so praktične izbire, ker omogočajo večerjo brez dodatne logistike.\n\n## 3. Za lokalno izkušnjo preveri Taste Ljubljana\n\nTaste Ljubljana izpostavlja jedi in okuse, povezane z mestno kulinarično dediščino. To je dobra smer, kadar želiš gostu pokazati nekaj bolj lokalnega kot samo generično evropsko restavracijo.\n\n## 4. Za sproščen večer so bistroji pogosto najboljši kompromis\n\nLjubljana ima dober srednji segment: bistroje, vinske bare, mestne gostilne in lokale s sezonsko karto. Ti so pogosto najbolj uporabna izbira za večer s prijatelji, zmenek ali kakovostno večerjo brez pretirane formalnosti.\n\n## 5. Za kosilo štejejo hitrost, razdalja in zanesljivost\n\nZa delovno kosilo štejejo bližina, hitrost, možnost rezervacije in jasen dnevni meni.\n\n## 6. Za petek in soboto rezerviraj prej\n\nPetek in sobota zvečer se hitro napolnita, posebno v centru in ob dogodkih. Pri skupinah rezerviraj prej in povej namen obiska.\n\n## 7. Ne primerjaj vseh lokalov v isti koš\n\nFine dining, pica, brunch, tradicionalna gostilna, azijski bistro in bar s prigrizki niso ista kategorija. Zato so seznami top 10 koristni samo, če veš, za kakšno priložnost izbiraš.\n\n## 8. Najprej javni viri, potem uradni podatki lokala\n\nJavni turistični in gastronomski viri so dober začetek, vendar niso vedno zadnja operativna informacija. Restavracije spreminjajo menije, delovni čas, dopuste in rezervacijske sisteme.\n\n## 9. Tržnica je del kulinaričnega obiska\n\nZa obiskovalce Ljubljane je osrednja tržnica pogosto del izkušnje. Tudi če večerjaš drugje, sprehod skozi tržnico pomaga razumeti lokalne sestavine, ritem mesta in povezavo med kulinariko in javnim prostorom.\n\n## 10. Najboljša izbira je tista, ki ustreza tvojemu večeru\n\nZa posebno večerjo preveri Michelin in Gault&Millau. Za lokalno zgodbo preveri Taste Ljubljana. Za pregled ponudbe uporabi Visit Ljubljana. Za končno odločitev pa preveri aktualne podatke pri restavraciji.\n\n## Viri\n\n- Visit Ljubljana, restavracije in gostilne: https://www.visitljubljana.com/sl/obiskovalci/kulinarika/restavracije\n- Michelin, The MICHELIN Guide Slovenia 2026 Edition: https://www.michelin.com/en/publications/products-and-services/the-michelin-guide-slovenia-2026-edition`,\n    category: "Aktualno",\n    author: "Uredništvo Blog Lab",\n    status: "published",\n    heroImage: null,\n    video: null,\n    gallery: [],\n    sources: [{ label: "Visit Ljubljana — Restavracije in gostilne", url: "https://www.visitljubljana.com/sl/obiskovalci/kulinarika/restavracije" }, { label: "Michelin — The MICHELIN Guide Slovenia 2026 Edition", url: "https://www.michelin.com/en/publications/products-and-services/the-michelin-guide-slovenia-2026-edition" }],\n    createdAt: "2026-09-21T12:32:31+02:00",\n    updatedAt: "2026-09-21T12:32:31+02:00"\n  },'''
          start_marker = '  {\n    "id": "sign-in-to-your-account-4b374c63"'
          if start_marker in text:
              start = text.index(start_marker)
              end = text.index('\n\n  {\n    "id": "s-tribune-sportni-trenutki', start)
              text = text[:start] + article + text[end:]
          elif '10 idej za dober obisk restavracij v Ljubljani v 2026' not in text:
              raise SystemExit('bad article object not found')
          helpers = '''\nfunction normalizeArticleLookup(value) { return String(value || "").trim().toLowerCase(); }\nfunction resolveSelectedArticle(articles, requestedId) { const wanted = normalizeArticleLookup(requestedId); if (!wanted) return null; return articles.find((article) => { const id = normalizeArticleLookup(article.id); const aliases = Array.isArray(article.aliases) ? article.aliases.map(normalizeArticleLookup) : []; return id === wanted || aliases.includes(wanted) || id.startsWith(wanted) || wanted.startsWith(id); }) || null; }\nfunction plainArticleText(value) { return String(value || "").replace(/```[\\s\\S]*?```/g, " ").replace(/\\[[^\\]]+\\]\\([^\\)]+\\)/g, "$1").replace(/[#>*_`~-]/g, " ").replace(/\\s+/g, " ").trim(); }\nfunction articleBodyContent(article) { const lines = String(article?.content || "").split("\\n"); const title = plainArticleText(article?.title).toLowerCase(); while (lines.length && !lines[0].trim()) lines.shift(); if (lines[0]?.startsWith("# ")) { const first = plainArticleText(lines[0].slice(2)).toLowerCase(); if (first && (first === title || title.includes(first) || first.includes(title))) { lines.shift(); while (lines.length && !lines[0].trim()) lines.shift(); } } if (Array.isArray(article?.sources) && article.sources.length) { const idx = lines.findIndex((line) => /^##\\s+viri\\s*$/i.test(line.trim())); if (idx >= 0) lines.splice(idx); } return lines.join("\\n").trim(); }\nfunction articleDigest(article) { return articleBodyContent(article).split(/\\n{2,}/).map(plainArticleText).filter((p) => p && !/^vir\\b/i.test(p)).slice(0, 2).join(" ") || article?.excerpt || "Pregleden uredniški članek z jasnim kontekstom in viri."; }\nfunction articleOutline(article) { return String(article?.content || "").split("\\n").filter((line) => /^##\\s+/.test(line.trim())).map((line) => line.replace(/^##\\s+/, "").trim()).filter((line) => line && !/^viri$/i.test(line)).slice(0, 7); }\nfunction ArticleTemplate({ selected, navigate, openEditorialTerminal }) { const sourceCount = Array.isArray(selected.sources) ? selected.sources.length : 0; const outline = articleOutline(selected); return (<article className="article-page article-page--premium"><button className="back article-back" onClick={() => navigate("home")}>← Vse objave</button><header className="article-heading article-heading--premium"><div className="article-kicker-row"><span className="article-category">{selected.category}</span><span className="article-template-badge">Uredniški članek</span></div><h1>{selected.title}</h1><p>{selected.excerpt}</p><div className="article-byline article-byline--premium"><strong>{selected.author}</strong><span>•</span><span>{formatDate(selected.updatedAt)}</span><span>•</span><span>{readingTime(selected.content)} min branja</span></div><div className="article-metrics" aria-label="Podatki o članku"><div><strong>{readingTime(selected.content)}</strong><span>min branja</span></div><div><strong>{outline.length || "—"}</strong><span>sklopov</span></div><div><strong>{sourceCount || "—"}</strong><span>virov</span></div></div></header><ArticleHero article={selected} /><div className="article-layout article-layout--premium"><aside className="article-side-panel" aria-label="Pregled članka"><div className="article-side-card"><span className="kicker">V ČLANKU</span>{outline.length ? <ol>{outline.map((item) => <li key={item}>{item}</li>)}</ol> : <p>Članek je strukturiran kot kratek uredniški pregled.</p>}</div><div className="article-side-card muted-card"><span className="kicker">PREVERJANJE</span><p>{sourceCount ? `Dodani so ${sourceCount} javno preverljivi viri.` : "Pri članku ni dodanih posebnih zunanjih virov."}</p></div></aside><div className="article-main-copy"><section className="article-summary-card"><span className="kicker">HITER POVZETEK</span><p>{articleDigest(selected)}</p></section><ArticleBody content={articleBodyContent(selected)} /></div></div><ArticleVideo video={selected.video} /><ArticleGallery items={selected.gallery} /><ArticleSources items={selected.sources} /><div className="article-end"><span>Konec članka</span><button className="secondary" onClick={openEditorialTerminal}>Uredniški terminal ↗</button></div></article>); }\n\n'''
          if 'function resolveSelectedArticle' not in text:
              text = text.replace('function ArticleBody({ content }) {', helpers + 'function ArticleBody({ content }) {', 1)
          text = text.replace('  const selected = articles.find((article) => article.id === selectedId);', '  const selected = resolveSelectedArticle(articles, selectedId);')
          old = '''      const requestedId = new URLSearchParams(window.location.search).get("article");
      if (requestedId && articles.some((article) => article.id === requestedId)) {
        setSelectedId(requestedId);
        setView("article");
      } else {
        setSelectedId("");
        setView("home");
      }'''
          new = '''      const requestedId = new URLSearchParams(window.location.search).get("article");
      const matchedArticle = resolveSelectedArticle(articles, requestedId);
      if (matchedArticle) {
        setSelectedId(matchedArticle.id);
        setView("article");
      } else {
        setSelectedId("");
        setView("home");
      }'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('URL resolver block not found')
          block_start = '      {view === "article" && selected && (\n        <article className="article-page">'
          if block_start in text:
              s = text.index(block_start)
              e = text.index('\n\n      {preview && (', s)
              text = text[:s] + '      {view === "article" && selected && (\n        <ArticleTemplate selected={selected} navigate={navigate} openEditorialTerminal={openEditorialTerminal} />\n      )}' + text[e:]
          elif '<ArticleTemplate selected={selected}' not in text:
              raise SystemExit('article page block not found')
          app.write_text(text, encoding='utf-8')
          css_path = Path('src/styles.css')
          css = css_path.read_text(encoding='utf-8')
          css_add = '''/* Blog Lab article template upgrade v1 */\n.article-page--premium{width:min(1120px,calc(100% - 48px));background:transparent}.article-back{margin-bottom:18px}.article-heading--premium{position:relative;overflow:hidden;padding:clamp(34px,6vw,64px);border:1px solid color-mix(in srgb,var(--line) 72%,transparent);border-radius:34px;background:radial-gradient(circle at 88% 8%,color-mix(in srgb,var(--mint) 78%,transparent),transparent 34%),linear-gradient(145deg,color-mix(in srgb,var(--white) 98%,transparent),color-mix(in srgb,var(--paper) 86%,var(--white)));box-shadow:0 26px 70px rgba(20,41,61,.10)}.article-kicker-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.article-template-badge{display:inline-flex;align-items:center;min-height:28px;padding:0 11px;border:1px solid color-mix(in srgb,var(--green) 24%,transparent);border-radius:999px;background:rgba(255,255,255,.62);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.article-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:30px;max-width:560px}.article-metrics div{padding:16px 18px;border:1px solid color-mix(in srgb,var(--line) 76%,transparent);border-radius:18px;background:rgba(255,255,255,.62)}.article-metrics strong{display:block;font:800 27px/1 Georgia,serif;color:var(--green-dark)}.article-metrics span{display:block;margin-top:6px;color:var(--muted);font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.08em}.article-layout--premium{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:clamp(24px,4vw,44px);align-items:start;margin-top:34px}.article-main-copy{min-width:0;padding:clamp(26px,4vw,44px);border:1px solid color-mix(in srgb,var(--line) 78%,transparent);border-radius:30px;background:rgba(255,255,255,.88);box-shadow:0 18px 52px rgba(24,48,70,.07)}.article-summary-card{margin-bottom:34px;padding:clamp(20px,3vw,28px);border-left:5px solid var(--green);border-radius:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--mint) 60%,white),rgba(255,255,255,.76))}.article-summary-card p{margin:10px 0 0;font-size:clamp(18px,2vw,21px);line-height:1.66;max-width:72ch}.article-side-panel{position:sticky;top:96px;display:grid;gap:14px;order:2}.article-side-card{padding:22px;border:1px solid color-mix(in srgb,var(--line) 78%,transparent);border-radius:24px;background:rgba(255,255,255,.84);box-shadow:0 14px 42px rgba(24,48,70,.055)}.article-side-card ol{margin:14px 0 0;padding-left:20px}.article-side-card li{margin:0 0 10px;line-height:1.42;font-size:14px}.article-body h1{display:none}.article-body h2{margin-top:42px;margin-bottom:13px;font:800 clamp(27px,3vw,38px)/1.12 Georgia,serif}.article-body p{max-width:76ch;font-size:18px;line-height:1.86}@media(max-width:960px){.article-layout--premium{grid-template-columns:1fr}.article-side-panel{position:static;order:-1}}@media(max-width:640px){.article-page--premium{width:min(100% - 28px,1120px);padding-top:34px}.article-heading--premium,.article-main-copy{border-radius:22px;padding:22px}.article-metrics{grid-template-columns:1fr}.article-body p{font-size:16.5px;line-height:1.78}}'''
          if 'Blog Lab article template upgrade v1' not in css:
              css_path.write_text(css.rstrip() + '\n\n' + css_add + '\n', encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Guardian check
        run: npm run guardian:check
      - name: Verify patch
        run: |
          grep -q "10 idej za dober obisk restavracij v Ljubljani v 2026" src/App.jsx
          grep -q "function ArticleTemplate" src/App.jsx
          grep -q "sign-in-to-your-account-4b374c6" src/App.jsx
          grep -q "Blog Lab article template upgrade v1" src/styles.css
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "blog-lab-maintenance[bot]"
          git config user.email "blog-lab-maintenance[bot]@users.noreply.github.com"
          git add src/App.jsx src/styles.css
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Improve article template and repair bad restaurant post"
          git push
