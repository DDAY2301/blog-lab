          helpers = r'''
function normalizeArticleLookup(value) {
  return String(value || "").trim().toLowerCase();
}

function resolveSelectedArticle(articles, requestedId) {
  const wanted = normalizeArticleLookup(requestedId);
  if (!wanted) return null;
  return articles.find((article) => {
    const id = normalizeArticleLookup(article.id);
    const aliases = Array.isArray(article.aliases) ? article.aliases.map(normalizeArticleLookup) : [];
    return id === wanted || aliases.includes(wanted) || id.startsWith(wanted) || wanted.startsWith(id);
  }) || null;
}

function plainArticleText(value) {
  return String(value || "").replace(/```[\s\S]*?```/g, " ").replace(/\[[^\]]+\]\([^\)]+\)/g, "$1").replace(/[#>*_`~-]/g, " ").replace(/\s+/g, " ").trim();
}

function articleBodyContent(article) {
  const lines = String(article?.content || "").split("\n");
  const title = plainArticleText(article?.title).toLowerCase();
  while (lines.length && !lines[0].trim()) lines.shift();
  if (lines[0]?.startsWith("# ")) {
    const first = plainArticleText(lines[0].slice(2)).toLowerCase();
    if (first && (first === title || title.includes(first) || first.includes(title))) {
      lines.shift();
      while (lines.length && !lines[0].trim()) lines.shift();
    }
  }
  if (Array.isArray(article?.sources) && article.sources.length) {
    const idx = lines.findIndex((line) => /^##\s+viri\s*$/i.test(line.trim()));
    if (idx >= 0) lines.splice(idx);
  }
  return lines.join("\n").trim();
}

function articleDigest(article) {
  return articleBodyContent(article).split(/\n{2,}/).map(plainArticleText).filter((p) => p && !/^vir\b/i.test(p)).slice(0, 2).join(" ") || article?.excerpt || "Pregleden uredniški članek z jasnim kontekstom in viri.";
}

function articleOutline(article) {
  return String(article?.content || "").split("\n").filter((line) => /^##\s+/.test(line.trim())).map((line) => line.replace(/^##\s+/, "").trim()).filter((line) => line && !/^viri$/i.test(line)).slice(0, 7);
}

function ArticleTemplate({ selected, navigate, openEditorialTerminal }) {
  const sourceCount = Array.isArray(selected.sources) ? selected.sources.length : 0;
  const outline = articleOutline(selected);
  return (
    <article className="article-page article-page--premium">
      <button className="back article-back" onClick={() => navigate("home")}>← Vse objave</button>
      <header className="article-heading article-heading--premium">
        <div className="article-kicker-row"><span className="article-category">{selected.category}</span><span className="article-template-badge">Uredniški članek</span></div>
        <h1>{selected.title}</h1>
        <p>{selected.excerpt}</p>
        <div className="article-byline article-byline--premium"><strong>{selected.author}</strong><span>•</span><span>{formatDate(selected.updatedAt)}</span><span>•</span><span>{readingTime(selected.content)} min branja</span></div>
        <div className="article-metrics" aria-label="Podatki o članku"><div><strong>{readingTime(selected.content)}</strong><span>min branja</span></div><div><strong>{outline.length || "—"}</strong><span>sklopov</span></div><div><strong>{sourceCount || "—"}</strong><span>virov</span></div></div>
      </header>
      <ArticleHero article={selected} />
      <div className="article-layout article-layout--premium">
        <aside className="article-side-panel" aria-label="Pregled članka"><div className="article-side-card"><span className="kicker">V ČLANKU</span>{outline.length ? <ol>{outline.map((item) => <li key={item}>{item}</li>)}</ol> : <p>Članek je strukturiran kot kratek uredniški pregled.</p>}</div><div className="article-side-card muted-card"><span className="kicker">PREVERJANJE</span><p>{sourceCount ? `Dodani so ${sourceCount} javno preverljivi viri.` : "Pri članku ni dodanih posebnih zunanjih virov."}</p></div></aside>
        <div className="article-main-copy"><section className="article-summary-card"><span className="kicker">HITER POVZETEK</span><p>{articleDigest(selected)}</p></section><ArticleBody content={articleBodyContent(selected)} /></div>
      </div>
      <ArticleVideo video={selected.video} />
      <ArticleGallery items={selected.gallery} />
      <ArticleSources items={selected.sources} />
      <div className="article-end"><span>Konec članka</span><button className="secondary" onClick={openEditorialTerminal}>Uredniški terminal ↗</button></div>
    </article>
  );
}

'''
