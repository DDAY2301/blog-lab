name: Fix Article Template

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-article-template.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Patch article template and bad restaurant post
        shell: bash
        run: |
          set -euo pipefail
