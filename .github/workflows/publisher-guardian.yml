name: Blog Lab Publisher Guardian

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_run:
    workflows:
      - "Blog Lab Publisher Agent"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: blog-lab-publisher-guardian
  cancel-in-progress: false

jobs:
  guard-publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      AGENT_ENABLED: true
      PUBLISH_MODE: automatic
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync latest main
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-agent.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          pip install -r requirements-agent.txt
          npm ci

      - name: Run autonomous publisher guardian
        shell: bash
        run: |
          python -m py_compile agents/blog-lab-publisher/guardian_repair.py agents/blog-lab-publisher/autonomous_fallback.py agents/blog-lab-publisher/services/*.py agents/blog-lab-publisher/schedule.py
          python agents/blog-lab-publisher/guardian_repair.py

      - name: Build and scan when changed
        shell: bash
        run: |
          if git diff --quiet -- src/App.jsx data public/data logs; then
            echo "No publisher repair changes."
            exit 0
          fi
          npm run build
          if git grep -I -n -E "(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,})" -- . ':(exclude)package-lock.json'; then
            exit 1
          fi

      - name: Commit autonomous repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "blog-lab-publisher-guardian[bot]"
          git config user.email "blog-lab-publisher-guardian[bot]@users.noreply.github.com"
          git add -A -- src/App.jsx data public/data || true
          if [[ -e logs ]]; then
            git add -A -- logs
          fi
          if git diff --cached --quiet; then
            echo "No repair commit needed."
            exit 0
          fi
          git commit -m "Guardian: repair missed publisher slot"
          git pull --rebase origin main
          git push origin HEAD:main
