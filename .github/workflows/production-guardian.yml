name: Blog Lab Production Guardian

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "agents/**"
      - "terminal/worker/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "wrangler.jsonc"
      - "requirements-agent.txt"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
  workflow_run:
    workflows:
      - "Blog Lab Health Check"
      - "Blog Lab External Smoke Test"
      - "Blog Lab Full E2E Audit"
      - "Blog Lab Self Heal"
    types: [completed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      strict_remote:
        description: "Treat live public/Worker health warnings as failures"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      repair:
        description: "Run deterministic guardian repair and open a PR if changes are produced"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

concurrency:
  group: blog-lab-production-guardian-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  guardian:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-agent.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements-agent.txt
          npm ci

      - name: Apply protected public publishing lock
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f scripts/lock_public_editor_and_chat.py ]]; then
            echo "No public lock script present."
            exit 0
          fi
          python scripts/lock_public_editor_and_chat.py
          node --check terminal/worker/src/index.js
          grep -q 'PUBLIC_WRITE_LOCK_NOTICE' src/App.jsx
          grep -q 'false && view === "editor"' src/App.jsx
          grep -q 'Objavljanje zaklenjeno' src/App.jsx
          grep -q 'function cleanTerminalChatAnswer' terminal/worker/src/index.js
          npm run build
          if git diff --quiet -- src/App.jsx src/styles.css terminal/worker/src/index.js; then
            echo "Protected publishing lock already applied."
            exit 0
          fi
          git config user.name "blog-lab-guard[bot]"
          git config user.email "blog-lab-guard[bot]@users.noreply.github.com"
          git add src/App.jsx src/styles.css terminal/worker/src/index.js
          git commit -m "Lock public publishing and clean terminal chatbot"
          git push

      - name: Run production guardian check
        id: guardian_check
        shell: bash
        continue-on-error: true
        env:
          STRICT_REMOTE_INPUT: ${{ github.event.inputs.strict_remote || 'true' }}
        run: |
          set -euo pipefail
          mkdir -p logs "$RUNNER_TEMP/guardian"
          STRICT_FLAG="--strict-remote"
          if [[ "$STRICT_REMOTE_INPUT" == "false" || "${{ github.event_name }}" == "pull_request" ]]; then
            STRICT_FLAG=""
          fi
          python agents/production-guardian/guardian.py check \
            $STRICT_FLAG \
            --report "$RUNNER_TEMP/guardian/report.json" \
            --markdown "$RUNNER_TEMP/guardian/report.md"

      - name: Upload guardian report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: production-guardian-report
          path: |
            ${{ runner.temp }}/guardian/report.json
            ${{ runner.temp }}/guardian/report.md
          if-no-files-found: ignore

      - name: Run deterministic guardian repair
        id: deterministic_repair
        if: ${{ github.event_name != 'pull_request' && (github.event.inputs.repair || 'true') == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python agents/production-guardian/guardian.py repair --json
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate repaired repository
        if: ${{ steps.deterministic_repair.outputs.changed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile agents/operator-terminal/*.py agents/blog-lab-publisher/agent.py agents/blog-lab-publisher/services/*.py agents/self-heal/*.py agents/production-guardian/guardian.py agents/production_guardian_import.py
          pytest -q agents/operator-terminal/tests agents/blog-lab-publisher/tests agents/self-heal/tests agents/production-guardian/tests
          npm run build
          npm run test:guardian
          node scripts/test-worker-browser-js.mjs
          node scripts/test-worker-auth.mjs
          node scripts/test-worker-routes.mjs
          npx wrangler deploy --dry-run

      - name: Open validated guardian PR
        if: ${{ steps.deterministic_repair.outputs.changed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="production-guardian/auto-${GITHUB_RUN_ID}"
          git config user.name "blog-lab-guardian[bot]"
          git config user.email "blog-lab-guardian[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A -- package.json public/guardian-manifest.json logs/.gitkeep
          git commit -m "Guardian: apply deterministic production hygiene repair"
          git push --set-upstream origin "$BRANCH"
          gh pr create \
            --title "Guardian: validated production hygiene repair" \
            --body "Production Guardian detected missing deterministic hygiene changes and applied them after validation. This PR is intentionally reviewable and does not bypass tests or protected-path rules." \
            --base main \
            --head "$BRANCH"

      - name: Fail when guardian detected an unresolved production issue
        if: ${{ steps.guardian_check.outcome == 'failure' && steps.deterministic_repair.outputs.changed != 'true' }}
        shell: bash
        run: |
          echo "::error::Production Guardian found an unresolved issue. See the uploaded production-guardian-report artifact."
          exit 1
