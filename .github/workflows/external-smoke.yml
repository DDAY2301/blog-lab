name: Blog Lab External Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: blog-lab-external-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  external-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Wait for live Cloudflare Worker deployment
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          URL="https://blog-lab.dan-grmusa.workers.dev/health"
          EXPECTED_VERSION="$(python - <<'PY'
          import re
          from pathlib import Path
          source = Path("terminal/worker/src/index.js").read_text(encoding="utf-8")
          match = re.search(r'version:\s*"([^"]+)"', source)
          if not match:
              raise SystemExit("Worker version marker not found")
          print(match.group(1))
          PY
          )"
          echo "Expected Worker version: $EXPECTED_VERSION"
          for attempt in {1..24}; do
            echo "Worker probe $attempt/24"
            body="$(curl -fsS --max-time 20 "$URL" || true)"
            if BODY="$body" EVENT_NAME="$EVENT_NAME" EXPECTED_VERSION="$EXPECTED_VERSION" python - <<'PY' 2>/dev/null
          import json, os, sys
          d = json.loads(os.environ.get("BODY", "{}"))
          base = (
              d.get("ok") is True
              and d.get("ready") is True
              and d.get("auth_ready") is True
              and d.get("auth_self_test_ok") is True
              and d.get("authorized_users_ready") == 2
              and d.get("media_upload_ready") is True
          )
          expected = os.environ.get("EXPECTED_VERSION", "")
          if os.environ.get("EVENT_NAME") == "pull_request":
              version_ok = str(d.get("version") or "").startswith("auth-v6.")
              ai_ok = True
          else:
              version_ok = bool(expected) and d.get("version") == expected
              ai_ok = (
                  d.get("ai_writer_ready") is True
                  and d.get("ai_review_ready") is True
                  and d.get("site_editor_ready") is True
                  and d.get("self_heal_ai_ready") is True
                  and d.get("publisher_scheduler_ready") is True
              )
          sys.exit(0 if (base and version_ok and ai_ok) else 1)
          PY
            then
              echo "Live Worker is ready with the expected production capabilities."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Live Cloudflare Worker did not reach the expected ready state."
          exit 1

      - name: Detect writer-code change
        id: writer-changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" != "push" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git show --pretty= --name-only "$GITHUB_SHA")"
          if grep -Eq '^((terminal/worker/|agents/(blog-lab-publisher|self-heal)/|scripts/test-worker-|wrangler\.jsonc|terminal/worker/wrangler\.jsonc|\.github/workflows/(agent-blog-lab-publisher|operator-terminal|external-smoke|self-heal|health-check)\.yml))' <<<"$changed"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify resilient editorial writer path
        if: ${{ github.event_name == 'workflow_dispatch' || steps.writer-changes.outputs.changed == 'true' }}
        shell: bash
        env:
          WORKER_AI_TOKEN: ${{ secrets.TERMINAL_COMMAND_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$WORKER_AI_TOKEN" ]]; then
            echo "::error::TERMINAL_COMMAND_KEY is required for the internal writer smoke test."
            exit 1
          fi
          payload='{"system_prompt":"Vrni samo veljaven JSON objekt z naslovom title in poljem content. Piši v slovenščini.","task_prompt":"Napiši eno kratko, stvarno poved iz podanega vira.","category":"aktualno","source_items":[{"title":"Preizkus uredniškega sistema","summary":"Blog Lab preverja delovanje strežniškega AI pisca.","url":"https://example.com/test","source_name":"Sistemski preizkus"}]}'
          body="$(curl -sS --max-time 35             -X POST             -H "Authorization: Bearer $WORKER_AI_TOKEN"             -H "Content-Type: application/json"             --data "$payload"             https://blog-lab.dan-grmusa.workers.dev/api/ai/write || true)"
          BODY="$body" python - <<'PY'
          import json, os, sys
          raw = os.environ.get("BODY", "")
          try:
              d = json.loads(raw)
          except Exception:
              print("::warning::Workers AI writer did not return JSON quickly; publishing fallback remains the production path.")
              print(raw[:500])
              sys.exit(0)
          article = d.get("article") or {}
          ok = d.get("ok") is True and isinstance(article, dict) and bool(article.get("title")) and bool(article.get("content"))
          if ok:
              print("Workers AI editorial writer responded successfully.")
              sys.exit(0)
          text = json.dumps(d, ensure_ascii=False).lower()
          degraded = (
              d.get("ok") is False
              and (
                  "ai_inference_failed" in text
                  or "4006" in text
                  or "daily free allocation" in text
                  or "quota" in text
                  or "capacity" in text
                  or "bad gateway" in text
                  or "attempts" in d
              )
          )
          if degraded:
              print("::warning::Workers AI is degraded, but the publisher is configured with local_evidence_ai/deterministic fallback. This is not a production outage.")
              print(json.dumps(d, ensure_ascii=False)[:1200])
              sys.exit(0)
          print(d)
          sys.exit(1)
          PY

      - name: Verify production scheduler dispatch bridge
        if: ${{ github.event_name == 'workflow_dispatch' || steps.writer-changes.outputs.changed == 'true' }}
        shell: bash
        env:
          INTERNAL_SCHEDULER_TOKEN: ${{ secrets.TERMINAL_COMMAND_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$INTERNAL_SCHEDULER_TOKEN" ]]; then
            echo "::error::TERMINAL_COMMAND_KEY is required for the scheduler production probe."
            exit 1
          fi
          body="$(curl -fsS --max-time 40             -X POST             -H "Authorization: Bearer $INTERNAL_SCHEDULER_TOKEN"             https://blog-lab.dan-grmusa.workers.dev/api/scheduler/catch-up)"
          BODY="$body" python - <<'PY'
          import json, os, sys
          d = json.loads(os.environ["BODY"])
          if d.get("ok") is not True or d.get("mode") != "catch_up":
              print(d)
              sys.exit(1)
          print("Production scheduler dispatch bridge responded successfully.")
          PY

      - name: Verify private terminal login page is externally reachable
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 20 https://blog-lab.dan-grmusa.workers.dev/)"
          grep -Fq 'id="login"' <<<"$body"
          grep -Fq 'Zasebni terminal' <<<"$body"
          if grep -Fq 'maj@klemenc.org' <<<"$body"; then
            echo "::error::Login page exposes an authorized email."
            exit 1
          fi

      - name: Wait for live GitHub Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          URL="https://dday2301.github.io/blog-lab/"
          for attempt in {1..24}; do
            echo "Pages probe $attempt/24"
            body="$(curl -fsS --max-time 20 "$URL" || true)"
            if grep -Fq 'Blog Lab' <<<"$body"; then
              echo "Public Blog Lab is reachable."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Public GitHub Pages site is not reachable."
          exit 1

      - name: Verify persistent production article source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'blog-lab-system-test-persistent' src/App.jsx
          grep -Fq 'Testni članek Blog Lab: trajna objava na vseh napravah' src/App.jsx
