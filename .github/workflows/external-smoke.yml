name: Blog Lab External Smoke Test

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: blog-lab-external-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  external-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Wait for live Cloudflare Worker deployment
        shell: bash
        run: |
          set -euo pipefail
          URL="https://blog-lab.dan-grmusa.workers.dev/health"
          for attempt in {1..24}; do
            echo "Worker probe $attempt/24"
            body="$(curl -fsS --max-time 20 "$URL" || true)"
            if BODY="$body" python - <<'PY'
import json, os, sys
try:
    data=json.loads(os.environ.get("BODY",""))
except Exception:
    sys.exit(1)
required = (
    data.get("ok") is True
    and data.get("ready") is True
    and data.get("auth_ready") is True
    and data.get("version") == "auth-v3-cross-device"
)
sys.exit(0 if required else 1)
PY
            then
              echo "Live Worker is ready and running auth-v3-cross-device."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Live Cloudflare Worker did not reach the expected ready state."
          exit 1

      - name: Verify private terminal login page is globally reachable
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 20 https://blog-lab.dan-grmusa.workers.dev/)"
          grep -Fq 'id="login"' <<<"$body"
          grep -Fq 'maj@klemenc.org' <<<"$body" && {
            echo "::error::Login page must not expose authorized emails."
            exit 1
          } || true
          grep -Fq 'Zasebni terminal' <<<"$body"

      - name: Wait for live GitHub Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          URL="https://dday2301.github.io/blog-lab/"
          for attempt in {1..24}; do
            echo "Pages probe $attempt/24"
            body="$(curl -fsS --max-time 20 "$URL" || true)"
            if grep -Fq 'Blog Lab' <<<"$body"; then
              echo "Public Blog Lab is reachable."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Public GitHub Pages site is not reachable."
          exit 1

      - name: Verify persistent test article exists in production source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'blog-lab-system-test-persistent' src/App.jsx
          grep -Fq 'Testni članek Blog Lab: trajna objava na vseh napravah' src/App.jsx
