name: Blog Lab External Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: blog-lab-external-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  external-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Wait for live Cloudflare Worker deployment
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          URL="https://blog-lab.dan-grmusa.workers.dev/health"
          for attempt in {1..24}; do
            echo "Worker probe $attempt/24"
            body="$(curl -fsS --max-time 20 "$URL" || true)"
            if BODY="$body" EVENT_NAME="$EVENT_NAME" python - <<'PY' 2>/dev/null
          import json, os, sys
          d = json.loads(os.environ.get("BODY", "{}"))
          base = (
              d.get("ok") is True
              and d.get("ready") is True
              and d.get("auth_ready") is True
              and d.get("authorized_users_ready") == 2
              and d.get("media_upload_ready") is True
          )
          if os.environ.get("EVENT_NAME") == "pull_request":
              version_ok = d.get("version") in {"auth-v6.5-site-ai", "auth-v6.6-diagnostics"}
              ai_ok = True
          else:
              version_ok = d.get("version") == "auth-v6.6-diagnostics"
              ai_ok = d.get("ai_writer_ready") is True and d.get("site_editor_ready") is True
          sys.exit(0 if (base and version_ok and ai_ok) else 1)
          PY
            then
              echo "Live Worker is ready with the expected production capabilities."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Live Cloudflare Worker did not reach the expected ready state."
          exit 1

      - name: Detect writer-code change
        id: writer-changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" != "push" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git show --pretty= --name-only "$GITHUB_SHA")"
          if grep -Eq '^((terminal/worker/|agents/blog-lab-publisher/(agent\.py|services/ai_provider\.py|prompts/)|wrangler\.jsonc|terminal/worker/wrangler\.jsonc|\.github/workflows/(agent-blog-lab-publisher|operator-terminal|external-smoke)\.yml))' <<<"$changed"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Workers AI editorial writer
        if: ${{ github.event_name == 'workflow_dispatch' || steps.writer-changes.outputs.changed == 'true' }}
        shell: bash
        env:
          WORKER_AI_TOKEN: ${{ secrets.TERMINAL_COMMAND_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$WORKER_AI_TOKEN" ]]; then
            echo "::error::TERMINAL_COMMAND_KEY is required for the internal writer smoke test."
            exit 1
          fi
          payload='{"system_prompt":"Vrni samo veljaven JSON objekt z naslovom title in poljem content. Piši v slovenščini.","task_prompt":"Napiši eno kratko, stvarno poved iz podanega vira.","category":"aktualno","source_items":[{"title":"Preizkus uredniškega sistema","summary":"Blog Lab preverja delovanje strežniškega AI pisca.","url":"https://example.com/test","source_name":"Sistemski preizkus"}]}'
          body="$(curl -fsS --max-time 120             -X POST             -H "Authorization: Bearer $WORKER_AI_TOKEN"             -H "Content-Type: application/json"             --data "$payload"             https://blog-lab.dan-grmusa.workers.dev/api/ai/write)"
          BODY="$body" python - <<'PY'
          import json, os, sys
          d = json.loads(os.environ["BODY"])
          article = d.get("article") or {}
          ok = d.get("ok") is True and isinstance(article, dict) and bool(article.get("title")) and bool(article.get("content"))
          if not ok:
              print(d)
              sys.exit(1)
          print("Workers AI editorial writer responded successfully.")
          PY

      - name: Verify private terminal login page is externally reachable
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 20 https://blog-lab.dan-grmusa.workers.dev/)"
          grep -Fq 'id="login"' <<<"$body"
          grep -Fq 'Zasebni terminal' <<<"$body"
          if grep -Fq 'maj@klemenc.org' <<<"$body"; then
            echo "::error::Login page exposes an authorized email."
            exit 1
          fi

      - name: Wait for live GitHub Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          URL="https://dday2301.github.io/blog-lab/"
          for attempt in {1..24}; do
            echo "Pages probe $attempt/24"
            body="$(curl -fsS --max-time 20 "$URL" || true)"
            if grep -Fq 'Blog Lab' <<<"$body"; then
              echo "Public Blog Lab is reachable."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Public GitHub Pages site is not reachable."
          exit 1

      - name: Verify persistent production article source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'blog-lab-system-test-persistent' src/App.jsx
          grep -Fq 'Testni članek Blog Lab: trajna objava na vseh napravah' src/App.jsx
