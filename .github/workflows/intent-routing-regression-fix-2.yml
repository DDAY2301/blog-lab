name: Intent routing regression fix 2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/intent-routing-regression-fix-2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch precise add-article routing
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          function replaceOnce(path, from, to) {
            let text = fs.readFileSync(path, 'utf8');
            if (!text.includes(from)) {
              throw new Error(`Pattern not found in ${path}: ${from}`);
            }
            text = text.replace(from, to);
            fs.writeFileSync(path, text);
          }

          replaceOnce(
            'agents/operator-terminal/command.py',
            '"hero", "galer", "slik", "media", "format",',
            '"hero", "galer", "slik", "video", "posnet", "media", "format",'
          );

          replaceOnce(
            'agents/operator-terminal/command.py',
            '    if any(x in low for x in control_terms) or review_mode or _publish_mode_intent(low) or _schedule_intent(low) or _status_intent(low):\n        return "control"\n    if _article_configuration_intent(low):',
            '    if any(x in low for x in control_terms) or review_mode or _publish_mode_intent(low) or _schedule_intent(low) or _status_intent(low):\n        return "control"\n    if re.search(r"\\bdodaj\\s+(?:sedaj\\s+)?(?:clanek|novica|blog)\\s+(?:o|about|glede)\\b", low):\n        return "article"\n    if _article_configuration_intent(low):'
          );

          replaceOnce(
            'terminal/worker/src/index.js',
            '  const articleConfig = articleNouns.some((x) => tokens.has(x))\n    && ["dizajn","css","font","slika","galerija","izboljsaj","polepsaj","spremeni","dolzina","slog","besedilo","pisanje","naslov"].some((x) => tokens.has(x));',
            '  const articleTopic = articleActions.some((x) => tokens.has(x))\n    && /\\b(o|about|regarding|glede)\\b/.test(normalized);\n  const articleConfig = articleNouns.some((x) => tokens.has(x))\n    && ["dizajn","css","font","slika","galerija","video","izboljsaj","polepsaj","spremeni","dolzina","slog","besedilo","pisanje","naslov"].some((x) => tokens.has(x))\n    && !articleTopic;'
          );
          NODE

      - name: Validate routing matrix and protected tests
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          import pathlib
          import sys
          path = pathlib.Path('agents/operator-terminal/command.py').resolve()
          spec = importlib.util.spec_from_file_location('cmd', path)
          mod = importlib.util.module_from_spec(spec)
          sys.modules['cmd'] = mod
          spec.loader.exec_module(mod)
          cases = {
              'dodaj sedaj članek kako se je odvijalo dogajanje tega vikenda': 'article',
              'dodaj video v članek': 'site',
              'dodaj članek o video igrah': 'article',
              'dodaj drag and drop images in lepši design': 'site',
              'objavi članek in polepšaj izgled': 'site',
              'napiši daljši članek o gospodarstvu': 'article',
          }
          for text, expected in cases.items():
              got = mod.infer_mode(text)
              assert got == expected, (text, got, expected)
          print('routing matrix ok')
          PY
          node --check terminal/worker/src/index.js
          python -m py_compile agents/operator-terminal/*.py agents/blog-lab-publisher/agent.py agents/blog-lab-publisher/services/*.py
          pytest -q agents/operator-terminal/tests agents/blog-lab-publisher/tests

      - name: Commit fix and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/intent-routing-regression-fix.yml .github/workflows/intent-routing-regression-fix-2.yml || true
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agents/operator-terminal/command.py terminal/worker/src/index.js
          git commit -m "Fix precise article media routing"
          git push
