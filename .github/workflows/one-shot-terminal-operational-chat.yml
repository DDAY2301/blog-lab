name: One-shot terminal operational publication chat

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-terminal-operational-chat.yml"
      - ".terminal-chat-operational-trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-terminal-operational-chat
  cancel-in-progress: true

jobs:
  patch-terminal-chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Patch terminal chatbot with operational publication check
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('terminal/worker/src/index.js')
          text = path.read_text(encoding='utf-8')

          insert = r'''
async function fetchJsonNoStore(url) {
  const response = await fetch(url, {
    headers: {
      "accept": "application/json",
      "cache-control": "no-cache",
      "user-agent": "BlogLabTerminalOperationalCheck/1.0"
    },
    cf: { cacheTtl: 0, cacheEverything: false }
  });
  if (!response.ok) throw new Error(`Fetch failed ${response.status} for ${url}`);
  return response.json();
}

function ljubljanaNowParts() {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Europe/Ljubljana",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  }).formatToParts(new Date()).reduce((acc, part) => {
    acc[part.type] = part.value;
    return acc;
  }, {});
  const date = `${parts.year}-${parts.month}-${parts.day}`;
  const time = `${parts.hour}:${parts.minute}`;
  return { date, time };
}

function slotId(date, slot) {
  return `${date}|${slot.time}|${slot.category}`;
}

function shouldUsePublicationOperationalCheck(message) {
  const lower = String(message || "").toLowerCase();
  const hasPublication = lower.includes("objav") || lower.includes("član") || lower.includes("clan") || lower.includes("publisher") || lower.includes("guardian") || lower.includes("learning");
  const hasAction = lower.includes("preglej") || lower.includes("preveri") || lower.includes("reši") || lower.includes("resi") || lower.includes("popravi") || lower.includes("problem") || lower.includes("zakaj") || lower.includes("delovanje");
  return hasPublication && hasAction;
}

function publicationCheckText(state, status, learning, control, dueSlots, missingSlots, dispatched, dispatchError) {
  const done = Array.isArray(state.scheduled_slots_done) ? state.scheduled_slots_done : [];
  const deferred = Array.isArray(state.scheduled_slots_deferred) ? state.scheduled_slots_deferred : [];
  const schedule = control?.schedule?.slots || [];
  const nextSlots = schedule.map((slot) => `${slot.time} ${slot.category}`).join(", ") || "ni urnika";
  const lines = [];
  lines.push("Pregledal sem objavni sistem v treh slojih: Publisher Agent, Publisher Guardian in 24h Article Learning.");
  lines.push("");
  lines.push(`Publisher Agent: ${state.last_error ? "NAPAKA" : "OK"}`);
  lines.push(`- zadnji uspeh: ${state.last_success || "ni podatka"}`);
  lines.push(`- writer mode: ${state.writer_mode || status.writer_mode || "ni podatka"}`);
  lines.push(`- današnje objave: ${state.posts_today ?? status.posts_today ?? 0}`);
  lines.push(`- opravljeni scheduled sloti: ${done.length ? done.join(", ") : "še noben"}`);
  lines.push(`- deferred sloti: ${deferred.length ? deferred.join(", ") : "noben"}`);
  lines.push("");
  lines.push(`Publisher Guardian: ${missingSlots.length || deferred.length ? "mora popraviti / catch-up sprožen" : "OK"}`);
  lines.push(`- zapadli sloti do zdaj: ${dueSlots.length ? dueSlots.join(", ") : "noben"}`);
  lines.push(`- manjkajoči zapadli sloti: ${missingSlots.length ? missingSlots.join(", ") : "noben"}`);
  lines.push("");
  lines.push(`24h Article Learning: ${learning.status || "ni podatka"}`);
  lines.push(`- zadnja učna posodobitev: ${learning.updated_at || "ni podatka"}`);
  lines.push(`- loop count: ${learning.loop_count ?? "ni podatka"}`);
  lines.push("");
  lines.push(`Urnik: ${nextSlots}`);
  if (dispatched) {
    lines.push("");
    lines.push("Ukrep: sprožil sem Publisher catch-up, ker je bil najden manjkajoč ali deferred slot.");
  } else if (dispatchError) {
    lines.push("");
    lines.push(`Ukrep ni uspel: ${dispatchError}`);
  } else {
    lines.push("");
    lines.push("Ukrep: trenutno ni treba sprožiti popravila; sistem čaka naslednji scheduled slot ali heartbeat.");
  }
  if (state.last_error) lines.push(`Zadnja napaka: ${state.last_error}`);
  return lines.join("\n");
}

async function publicationOperationalAssistant(env, message) {
  const base = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main`;
  const [state, status, learning, control] = await Promise.all([
    fetchJsonNoStore(`${base}/data/agent-state.json`).catch(() => ({})),
    fetchJsonNoStore(`${base}/public/data/agent-status.json`).catch(() => ({})),
    fetchJsonNoStore(`${base}/public/data/article-learning-status.json`).catch(() => ({})),
    fetchJsonNoStore(`${base}/data/agent-control.json`).catch(() => ({}))
  ]);
  const now = ljubljanaNowParts();
  const slots = Array.isArray(control?.schedule?.slots) ? control.schedule.slots : [];
  const done = new Set(Array.isArray(state.scheduled_slots_done) ? state.scheduled_slots_done : []);
  const deferred = Array.isArray(state.scheduled_slots_deferred) ? state.scheduled_slots_deferred : [];
  const dueSlotIds = slots
    .filter((slot) => String(slot.time || "") <= now.time)
    .map((slot) => slotId(now.date, slot));
  const missing = dueSlotIds.filter((id) => !done.has(id));
  let dispatched = false;
  let dispatchError = "";
  if ((missing.length || deferred.length) && control.enabled !== false) {
    try {
      dispatched = await dispatchPublisherCatchup(env);
    } catch (error) {
      dispatchError = String(error?.message || error || "").slice(0, 240);
    }
  }
  return {
    mode: "operational_publication_check",
    text: publicationCheckText(state, status, learning, control, dueSlotIds, missing, dispatched, dispatchError)
  };
}
'''

          marker = '\nfunction terminalChatFallback(message, error = null) {'
          if 'function shouldUsePublicationOperationalCheck' not in text:
              if marker not in text:
                  raise SystemExit('terminalChatFallback marker not found')
              text = text.replace(marker, '\n' + insert + marker, 1)

          old = 'async function terminalChatAssistant(env, message, email) {\n  const system = ['
          new = '''async function terminalChatAssistant(env, message, email) {
  if (shouldUsePublicationOperationalCheck(message)) {
    try {
      return await publicationOperationalAssistant(env, message);
    } catch (error) {
      return {
        mode: "operational_publication_check",
        text: "Operativni pregled objav je naletel na napako: " + String(error?.message || error || "").slice(0, 240),
        error: sanitizeAiError(error)
      };
    }
  }
  const system = ['''
          if new not in text:
              if old not in text:
                  raise SystemExit('terminalChatAssistant marker not found')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate Worker syntax
        shell: bash
        run: node --check terminal/worker/src/index.js

      - name: Commit terminal operational check
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "blog-lab-maintenance[bot]"
          git config user.email "blog-lab-maintenance[bot]@users.noreply.github.com"
          git add terminal/worker/src/index.js
          if git diff --cached --quiet; then
            echo "No terminal operational chat changes needed."
            exit 0
          fi
          git commit -m "Terminal: add operational publication check"
          git push
