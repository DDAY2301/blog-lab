name: Blog Lab Live Pulse

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: blog-lab-live-pulse
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh live mini articles
        run: python agents/live-feed/update.py
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Commit live feed state
        shell: bash
        run: |
          if git diff --quiet -- public/live-feed.json; then
            echo "No live-feed changes."
          else
            git config user.name "blog-lab-live[bot]"
            git config user.email "blog-lab-live[bot]@users.noreply.github.com"
            git add public/live-feed.json
            git commit -m "Live feed: refresh mini articles"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
