name: Blog Lab Event Pulse
on:
  push:
    branches: [main]
    paths:
      - "agents/live-feed/**"
      - "src/LivePulse.jsx"
      - "public/events-feed.json"
      - ".github/workflows/live-feed.yml"
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
concurrency:
  group: blog-lab-event-pulse
  cancel-in-progress: true
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Sync latest main
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Refresh official event calendar
        run: python agents/live-feed/update.py
      - name: Install frontend dependencies
        run: npm ci
      - name: Commit event feed state
        shell: bash
        run: |
          if git diff --quiet -- public/events-feed.json; then
            echo "No event-feed changes."
          else
            git config user.name "blog-lab-events[bot]"
            git config user.email "blog-lab-events[bot]@users.noreply.github.com"
            git add public/events-feed.json
            git commit -m "Events: refresh Ljubljana and Slovenia calendar"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Build final synchronized site
        run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
