name: Blog Lab Self-Heal Watchdog

on:
  workflow_run:
    workflows:
      - "Private Operator Terminal"
      - "Blog Lab Publisher Agent"
      - "Blog Lab Health Check"
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  retry-failed-run:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-run failed jobs automatically
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Self-heal retry for run $RUN_ID"
          curl --fail-with-body             --request POST             --header "Accept: application/vnd.github+json"             --header "Authorization: Bearer $GH_TOKEN"             --header "X-GitHub-Api-Version: 2022-11-28"             "$API_URL/repos/$REPOSITORY/actions/runs/$RUN_ID/rerun-failed-jobs"

  retry-limit-reached:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt >= 3
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record bounded recovery stop
        run: |
          echo "::error::Automatic recovery stopped after 3 attempts for run ${{ github.event.workflow_run.id }}."
          echo "The run remains failed so the terminal can display the failure instead of looping forever."
