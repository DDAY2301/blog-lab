name: Blog Lab Secret Scan Regression
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/check_repo_secrets.py"
      - "scripts/tests/test_check_repo_secrets.py"
      - ".github/workflows/publisher-guardian.yml"
      - ".github/workflows/publisher-secret-scan.yml"
  push:
    branches: [main]
    paths:
      - "scripts/check_repo_secrets.py"
      - "scripts/tests/test_check_repo_secrets.py"
      - ".github/workflows/publisher-guardian.yml"
      - ".github/workflows/publisher-secret-scan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify scanner regression tests
        run: python -m unittest discover -s scripts/tests -p 'test_check_repo_secrets.py'
      - name: Scan repository without disclosing matches
        run: python scripts/check_repo_secrets.py
