<!doctype html>
<html lang="sl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blog Lab · Agent status</title><style>body{font-family:system-ui,sans-serif;max-width:860px;margin:40px auto;padding:0 20px;background:#f6f6f2;color:#171717}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:24px;box-shadow:0 8px 30px #0000000a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:18px}.item{background:#f8f8f6;padding:14px;border-radius:12px}.item b{display:block;font-size:12px;text-transform:uppercase;color:#666;margin-bottom:6px}a{color:inherit}.ok{display:inline-block;width:10px;height:10px;border-radius:50%;background:#2f8f4e;margin-right:8px}</style></head><body><p><a href="./">← Blog Lab</a></p><div class="card"><h1><span class="ok"></span>Agent status</h1><p id="message">Nalagam stanje …</p><div class="grid" id="grid"></div><p><a href="https://github.com/DDAY2301/blog-lab/actions">GitHub Actions</a> · <a href="https://github.com/DDAY2301/blog-lab/blob/main/agents/blog-lab-publisher/README.md">Navodila</a></p></div><script>fetch('./data/agent-status.json?ts='+Date.now()).then(r=>r.json()).then(s=>{document.getElementById('message').textContent=s.message||'';const fields=[['Agent',s.agent],['Status',s.status],['Vključen',String(s.enabled)],['Zadnji zagon',s.last_run||'—'],['Zadnji uspeh',s.last_success||'—'],['Zadnji rezultat',s.last_output||'—'],['Objave danes',s.posts_today??0],['Zadnja napaka',s.last_error||'—']];document.getElementById('grid').innerHTML=fields.map(([k,v])=>`<div class="item"><b>${k}</b><span>${String(v).replace(/[<>&]/g,'')}</span></div>`).join('');}).catch(()=>document.getElementById('message').textContent='Status trenutno ni dosegljiv.');</script></body></html>
